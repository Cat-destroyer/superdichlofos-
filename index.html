    else if(k==='toxAll'){squad.forEach(x=>{x.tox=Math.max(0,x.tox+v)});out.push(`Всем ${signed(v,'токсинов')}`)}
    else if(k==='xp'){ctx.ups.push(...petXP(p,v));out.push(`+${v} опыта`)}
    else if(k==='water'){R.loot.water+=v;out.push(`+${v} вода`)}
    else if(k==='mosq'){R.loot.mosq+=v;R.evMosq=(R.evMosq||0)+v;out.push(`+${v} комар`)}
    else if(k==='buffAtk'){const n=next();n.atk[p.id]=(n.atk[p.id]||0)+v;const t=`${p.name}: +${v} атака`;n.notes.push(t);out.push(`+${v} атака в следующем бою`)}
    else if(k==='buffMp'){const n=next();n.mp[p.id]=(n.mp[p.id]||0)+v;n.notes.push(`${p.name}: +${v} запала`);out.push(`+${v} запала в следующем бою`)}

  const[q,right,...rest]=it.q,note=rest.pop(),opts=shuffle([right,...rest]);
  $('#v-pick').innerHTML=`<div class="tape"></div><div class="scroll">
    <div class="stage evart">${evPic(e)}</div>
    <h2>${e.title}</h2><p>${esc(e.text)}</p>
    <h3>${THEMES[theme]}</h3><div class="qtxt">${esc(q)}</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-res="${i}">${esc(o)}</button>`).join('')}</div>
  </div>`;
  show('v-pick');
  const r=+(await ask()),ok=opts[r]===right;
  G.seen[it.id]=G.quizN;
  G.retry=G.retry.filter(x=>x!==it.id);if(!ok)G.retry.push(it.id);
  const ctx={ups:[]};
  const out=applyFx(ok?[['xp',10],['food',4],...(chance(.25)?[['water',1]]:[])]:[['tox',5]],p,ctx);
  save();
  await eventResult(e,p,`${ok?'Верно. Терминал неохотно пропускает отряд.':`Неверно, ответ: ${right}. Терминал бьётся током.`} ${note}`,out,ok);
  return ctx;
}
async function runEvent(id){
  const e=pickEvent(id),squad=R.pets.map(getPet).filter(Boolean);
  if(!e||!squad.length)return;
  R.evUsed.push(e.id);
  G.evN=(G.evN||0)+1;G.evSeen=G.evSeen||{};G.evSeen[e.id]=G.evN;
  const p=pick(squad),T=s=>s.replace(/\{n\}/g,p.name);
  let ctx;
  if(e.quiz)ctx=await runQuizEvent(e,p);
  else{
    const s=petStats(p);
    const card=(o,i)=>{
      const blocked=o.need&&G.food+R.loot.food<o.need;
      const hint=o.check?`${esc(p.name)}, ${CHECK_NAME[o.check.stat]} ${s[o.check.stat]}: шанс ${pct(checkChance(o.check,s))}`:o.luck?'Как повезёт':blocked?'Не хватает еды':'';
      return `<button class="perk" data-res="${i}" ${blocked?'disabled':''}><b>${esc(T(o.label))}</b>${hint?`<span>${hint}</span>`:''}</button>`;
    };
    $('#v-pick').innerHTML=`<div class="tape"></div><div class="scroll">
      <div class="stage evart">${evPic(e)}</div>
      <div class="big-t">${e.title}</div>
      <p>${esc(T(e.text))}</p>
      <h3>Что делаем?</h3>
      ${e.opts.map(card).join('')}
    </div>`;
    show('v-pick');
    const o=e.opts[+(await ask())];
    const win=o.check?chance(checkChance(o.check,s)):o.luck?chance(o.luck):true;
    const res=o.done||(win?o.ok:o.no);
    ctx={ups:[]};
    const out=applyFx(res.fx,p,ctx);
    save();
    await eventResult(e,p,T(res.text),out,win);
  }
  if(ctx&&ctx.fresh&&ctx.fresh.length)await superReveal(ctx.fresh,p);
  if(ctx)for(const{p:x,l,legend}of ctx.ups)await levelUpScreen(x,l,legend);
}

  {id:'q-go',scr:'v-quiz',when:()=>!Q&&!!$('#v-quiz [data-act="lab"]'),tgt:'#v-quiz [data-act="lab"]',on:'act:lab',t:'Теперь выбери, кого кусать.'},
  /* Первый укус */
  {id:'k-risk',scr:'v-lab',when:()=>!!$('#v-lab .bite-card'),tgt:'#v-lab .risk',
   t:'Перед укусом видны риски: смерть, психоз и сколько станет токсинов. Учебные комары безопасны, в игре риск настоящий.'},
  {id:'k-rel',scr:'v-lab',when:()=>!!$('#v-lab .bite-card'),tgt:()=>$('#v-lab .rel-good,#v-lab .rel-bad')||$('#v-lab .risk'),
   t:()=>$('#v-lab .rel-good')?'Видишь «Родство»? Эта кровь близка твоему зверю: токсинов будет меньше. Бывает и «Конфликт», тогда больше.':'Если кровь близка зверю, здесь появится «Родство»: токсинов меньше. «Конфликт» — наоборот. С этой кровью ни того, ни другого.'},
  {id:'k-bite',scr:'v-lab',when:()=>!!$('#v-lab .bite-card'),tgt:'#v-lab .bite-card .tag',on:'act:bite',t:'Ткни в зверя, чтобы выпустить на него комара.'},
  {id:'k-mut',scr:'v-lab',when:()=>!!$('#v-lab .card h2'),tgt:()=>$('#v-lab .card'),
   t:'Нога улитки, обычная мутация. Зелёное — плюс, красное — минус: капканы не страшны, зато ход на 1 короче. Мутации бывают обычные, редкие и эпические, и каждую видно на звере.'},
  {id:'k-home',scr:'v-lab',when:()=>!!$('#v-lab .card h2'),tgt:'#v-lab [data-act="home"]',on:'act:home',t:'Возвращайся на базу.'},
  /* Второй комар: как выбрать, кого кусать */
  {id:'h2-lab',scr:'v-base',tgt:'#v-base [data-act="lab"]',on:'act:lab',t:'Остался второй комар. В обучении его кровь терминал очистит сам.'},
  {id:'k2-blood',scr:'v-lab',when:()=>!!$('#v-lab .bite-card'),tgt:'#v-lab h2',t:'Кровь чудака. Как понять, кому её давать?'},
  {id:'k2-how',scr:'v-lab',when:()=>!!$('#v-lab .bite-card'),tgt:'#v-lab .risk',
   t:'Смотри на три вещи. Риски и токсины — здесь. Лимит мутаций: перегруз опасен. И Кодекс: там подсказки, кому не хватает части сочетания и какой для неё нужна кровь.'},
  {id:'k2-form',scr:'v-lab',when:()=>!!$('#v-lab .bite-card'),
   t:()=>'И ещё: две мутации одной чужой крови перестраивают зверя в новый вид. Своя кровь этого не делает.'+ownBlood()},
  {id:'k2-bite',scr:'v-lab',when:()=>!!$('#v-lab .bite-card'),tgt:'#v-lab .bite-card .tag',on:'act:bite',t:'Кусаем.'},
  {id:'k2-mut',scr:'v-lab',when:()=>!!$('#v-lab .card h2'),tgt:()=>$('#v-lab .card'),t:'Перепончатые лапы: +1 ход, лужи не вредят.'},
  {id:'k2-combo',scr:'v-lab',when:()=>!!$('#v-lab .card.sup'),skip:()=>current==='v-lab'&&!!$('#v-lab .card h2')&&!$('#v-lab .card.sup'),tgt:'#v-lab .card.sup',
   t:'Скрытое сочетание! Нога улитки и перепонки срослись в ласты: минус улитки пропал, зато за зверем остаются лужи. У каждого сочетания свой плюс и минус. Бывают обычные, редкие, эпические и легендарные.'},
  {id:'k2-home',scr:'v-lab',when:()=>!!$('#v-lab .card h2'),tgt:'#v-lab [data-act="home"]',on:'act:home',t:'На базу.'},
  /* Кодекс */
  {id:'c-open',scr:'v-base',tgt:'#v-base [data-act="codex"]',on:'act:codex',t:'Загляни в Кодекс.'},
  {id:'c-tiers',scr:'v-base',sheet:true,tgt:'#sheet .ctierh.ct1',t:'Скрытые сочетания по редкости. Всё открытое записывается сюда навсегда.'},
  {id:'c-hint',scr:'v-base',sheet:true,skip:()=>!$('#sheet').hidden&&!$('#sheet .mline.hint'),tgt:()=>$('#sheet .mline.hint'),
   t:'Подсказка: у зверя уже есть часть сочетания. Знаки вопроса — чего не хватает, в скобках — какая нужна кровь. По подсказкам и решают, кому давать комара.'},
  {id:'c-forms',scr:'v-base',sheet:true,tgt:'#sheet .formsh',t:'Новые виды: звери, перестроенные чужой кровью.'},
  {id:'c-blood',scr:'v-base',sheet:true,tgt:()=>$('#sheet .bloodh'),t:'Ниже все мутации по крови. Неоткрытые скрыты, но видно, сколько их и какой они редкости.'},
  {id:'c-close',scr:'v-base',sheet:true,tgt:'#sheet [data-act="closeSheet"]',on:'act:closeSheet',t:'Закрой Кодекс.'},
  {id:'e-done',scr:'v-base',tgt:'#v-base [data-act="raid"]',last:true,
   t:()=>{const p=G.pets[0],full=p&&p.muts.length>=mutCap(p.lvl);return `Обучение пройдено.${full?` У твоего зверя уже ${p.muts.length} мутации из ${mutCap(p.lvl)}: следующего комара дай новому зверю из клетки или дождись 4-го уровня.`:''} Дальше сам: первый уровень — Двор лаборатории. Терминал почти в тебя верит.`}},
];
const TIX=Object.fromEntries(TSTEPS.map((s,i)=>[s.id,i]));

/* ---------- Подсветка ---------- */
const Coach={
  raf:0,shown:'',
  init(){
    const app=$('#app');if(!app||$('#coach'))return;
    const d=document.createElement('div');d.id='coach';d.hidden=true;
    d.innerHTML='<i class="ck-blk"></i><i class="ck-blk"></i><i class="ck-blk"></i><i class="ck-blk"></i><div class="ck-hole"></div><div class="ck-bub" role="dialog" aria-live="polite"></div>';
    app.appendChild(d);
    new MutationObserver(ms=>{if(ms.some(m=>!d.contains(m.target)))this.sync()}).observe(app,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});
    window.addEventListener('resize',()=>this.sync());
  },
  step(){return G.tutor?TSTEPS[TIX[G.tutor.at]]:null},
  ready(s){
    if(s.scr&&current!==s.scr)return false;
    const sh=$('#sheet'),open=!!(sh&&!sh.hidden);
    if(!!s.sheet!==open)return false;
    try{return!s.when||!!s.when()}catch(e){return false}
  },
  want(e){const s=this.step();return!!(s&&s.on&&[].concat(s.on).includes(e)&&this.ready(s))},
  go(id){if(G.tutor){G.tutor.at=id;save()}this.shown='';this.sync()},
  adv(){const n=TSTEPS[TIX[G.tutor.at]+1];if(n)this.go(n.id);else finishTutor()},
  on(e){if(G.tutor&&this.want(e))this.adv()},
  next(){const s=this.step();if(!s)return;if(s.last)finishTutor();else this.adv()},
  sync(){if(!this.raf)this.raf=requestAnimationFrame(()=>{this.raf=0;this.draw()})},
  inView(el){const sc=el.closest('.scroll');if(!sc)return true;const a=el.getBoundingClientRect(),b=sc.getBoundingClientRect();return a.top>=b.top-1&&a.bottom<=b.bottom+1},
  draw(){
    const box=$('#coach');if(!box)return;
    let s=this.step(),guard=0;
    while(s&&s.skip&&guard++<30){let k=false;try{k=!!s.skip()}catch(e){}if(!k)break;const n=TSTEPS[TIX[s.id]+1];if(!n){s=null;break}G.tutor.at=n.id;s=n}
    if(!s||!this.ready(s)){box.hidden=true;return}
    let tg=s.tgt;try{tg=typeof tg==='function'?tg():tg}catch(e){tg=null}
    let els=[];
    if(typeof tg==='string')els=[...document.querySelectorAll(tg)].filter(e=>e.getClientRects().length);
    else if(tg instanceof Element)els=[tg];
    else if(tg&&tg.width!=null)els=[tg];
    const first=els.find(e=>e instanceof Element);
    if(first&&!this.inView(first))first.scrollIntoView({block:'center'});
    let r=null;
    els.forEach(e=>{const q=e instanceof Element?e.getBoundingClientRect():e,R2={l:q.left,t:q.top,r:q.left+q.width,b:q.top+q.height};r=r?{l:Math.min(r.l,R2.l),t:Math.min(r.t,R2.t),r:Math.max(r.r,R2.r),b:Math.max(r.b,R2.b)}:R2});
    const A=$('#app').getBoundingClientRect(),AW=A.width,AH=A.height,pad=5;
    const h=r&&{l:Math.max(2,r.l-A.left-pad),t:Math.max(2,r.t-A.top-pad),r:Math.min(AW-2,r.r-A.left+pad),b:Math.min(AH-2,r.b-A.top+pad)};
    const act=!!s.on&&!!h,lost=!!s.on&&!h;
    box.hidden=false;box.classList.toggle('nohole',!h);
    const hole=box.querySelector('.ck-hole'),blk=box.querySelectorAll('.ck-blk'),bub=box.querySelector('.ck-bub');
    if(h)Object.assign(hole.style,{left:h.l+'px',top:h.t+'px',width:(h.r-h.l)+'px',height:(h.b-h.t)+'px'});
    const place=(el,x,y,w,hh)=>Object.assign(el.style,{left:x+'px',top:y+'px',width:Math.max(0,w)+'px',height:Math.max(0,hh)+'px'});
    if(act){place(blk[0],0,0,AW,h.t);place(blk[1],0,h.b,AW,AH-h.b);place(blk[2],0,h.t,h.l,h.b-h.t);place(blk[3],h.r,h.t,AW-h.r,h.b-h.t)}
    else{place(blk[0],0,0,AW,AH);[1,2,3].forEach(i=>place(blk[i],0,0,0,0))}
    const sig=s.id+(lost?'!':'');
    if(this.shown!==sig){
      this.shown=sig;
      const txt=typeof s.t==='function'?s.t():s.t;
      bub.innerHTML=`<p class="ck-t">${txt}</p><div class="ck-row"><button class="ck-skip" data-act="coachSkip">Пропустить обучение</button>${!s.on||lost?`<button class="btn main ck-go" data-act="coachNext">${s.last?'Готово':'Дальше'}</button>`:''}</div>`;
    }
    const bh=bub.offsetHeight,m=10;let top;
    if(!h)top=Math.max(m,(AH-bh)/2);
    else{
      const above=h.t,below=AH-h.b;
      if(below>=bh+2*m&&(below>=above||above<bh+2*m))top=h.b+m;
      else if(above>=bh+2*m)top=h.t-bh-m;
      else top=below>above?AH-bh-m:m;
    }
    bub.style.top=clamp(top,m,Math.max(m,AH-bh-m))+'px';
  },
};

/* ---------- Начало, пропуск, конец ---------- */
function startTutor(p){
  G.tutDone=true;G.tutor={at:TSTEPS[0].id,bit:0};save();
  Coach.shown='';startTutorFight();
}
/* Без обучения: то же, что даёт обучение. Второй уровень и два обычных комара */
async function quickStart(p){
  G.tutDone=true;G.mosq=2;p.lvl=2;p.xp=0;save();
  await levelUpScreen(p,2,false);
  save();renderBase();
}
function beginGame(race){
  const p=makePet(race);G.pets.push(p);
  if(tutWanted())startTutor(p);else quickStart(p);
}
async function skipTutor(){
  const T=G.tutor;if(!T)return;
  clearInterval(qTimer);Q=null;closeSheet();
  if(G.sandbox){pendingRes=null;B=null;R=null;G=REAL;REAL=null;Coach.sync();goHome();toast('Ты снова в своей игре.');return}
  G.tutor=null;Coach.sync();
  /* Бой уже выигран: экраны уровня и добычи сами дойдут до базы */
  if(R&&R.tutor&&(!B||B.over)){save();return}
  B=null;R=null;pendingRes=null;
  G.slide=null;G.pending=null;G.mosq=Math.max(0,2-(T.bit||0));
  const p=G.pets[0];
  if(p&&p.lvl<2){p.lvl=2;p.xp=0;save();await levelUpScreen(p,2,false)}
  save();goHome();
}
function finishTutor(){
  const sb=G.sandbox;
  if(sb){G=REAL;REAL=null}else{G.tutor=null;save()}
  Coach.shown='';closeSheet();goHome();Coach.sync();
  if(sb)toast('Обучение пройдено. Это снова твоя игра.');
}
/* Повтор из правил: своя игра откладывается в сторону и не сохраняется, пока идёт обучение */
function tutorAgain(){
  if(G.tutor||B||R)return;
  REAL=G;G={...NEW(),sandbox:true};closeSheet();renderStart();
}
/* После перезагрузки: бой начинается заново, остальное с ближайшего понятного места */
function tutorResume(){
  const T=G.tutor,p=G.pets[0];
  if(!p){G.tutor=null;return goHome()}
  if(p.lvl<2){T.at=TSTEPS[0].id;save();return startTutorFight()}
  const bit=T.bit||0;let at=TIX[T.at];if(at==null)at=TIX['h-food'];
  G.mosq=Math.max(0,2-bit-(G.slide?1:0)-(G.pending?1:0));
  let id=TSTEPS[at].id;
  if(at<TIX['h-food'])id='h-food';
  else if(at<TIX['h-lab']){if(TSTEPS[at].sheet)id='h-pet'}
  else if(at<TIX['h2-lab'])id=bit>=1?'h2-lab':G.pending?'k-risk':G.slide?'m-blood':'h-lab';
  else if(at<TIX['c-open'])id=bit>=2?'c-open':G.pending?'k2-blood':'h2-lab';
  else if(TSTEPS[at].sheet)id='c-open';
  T.at=id;save();Coach.shown='';
  if(id==='m-blood')openLab();
  else if(id==='k-risk'||id==='k2-blood')renderBite();
  else goHome();
}

/* ---------- Кнопки ---------- */
function twoTap(el,label,fn){
  if(el.dataset.armed){fn();return}
  el.dataset.armed='1';const old=el.textContent;el.textContent=label;
  setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=old}},2500);
}
const ACT={
  startWith:d=>beginGame(d.race),
  tutToggle:()=>{try{localStorage.setItem(TUT_KEY,tutWanted()?'1':'0')}catch(e){}renderStart()},
  tutAgain:tutorAgain,
  coachNext:()=>Coach.next(),
  coachSkip:(d,el)=>twoTap(el,'Точно пропустить?',skipTutor),
  pet:d=>openPet(d.id),
  closeSheet,
  water:d=>{const p=getPet(d.id);if(p&&G.water>0&&p.tox>0){G.water--;p.tox=Math.max(0,p.tox-WATER);save();renderBase();openPet(d.id)}},
  waterB:d=>{const p=getPet(d.id);if(p&&G.water>0&&p.tox>0){G.water--;p.tox=Math.max(0,p.tox-WATER);save();renderBite()}},
  cage:buyCage,codex:openCodex,grave:openGrave,rules:openRules,raid:renderRaid,lab:openLab,
  spec:async d=>{const p=getPet(d.id);if(!p)return;closeSheet();await chooseSpec(p);goHome();openPet(p.id)},
  tutskip:()=>{G.tutDone=true;save();if(B){B.tip='';B.tipId='';renderPanel()}},
  home:()=>{closeSheet();goHome()},
  theme:d=>{LAB.theme=d.k;const s=document.querySelector('#v-lab .scroll'),top=s?s.scrollTop:0;renderScope(false);const n=document.querySelector('#v-lab .scroll');if(n)n.scrollTop=top},
  tier:d=>startQuiz(+d.t),
  pickblood:d=>pickBlood(d.sp),unslide:unSlide,
  answer:d=>answer(+d.i),nextq:nextQ,
  bite:d=>{const p=getPet(d.id);if(p&&G.pending)doBite(p)},
  dump:(d,el)=>twoTap(el,'Точно выбросить?',()=>{G.pending=null;save();goHome()}),
  reset:(d,el)=>twoTap(el,'Точно стереть всё?',()=>{if(G.sandbox||G.tutor)return;G=NEW();save();closeSheet();renderStart()}),
  maplvl:d=>{SETUP.map=+d.i;SETUP.fresh=false;const s=document.querySelector('#v-raid .scroll'),top=s?s.scrollTop:0;renderRaid();const n=document.querySelector('#v-raid .scroll');if(n)n.scrollTop=top},
  camfit:()=>Cam.toggleFit(),camgo:d=>Cam.goUid(d.uid),
  lvl:d=>{SETUP.lvl=+d.i;SETUP.map=null;SETUP.fresh=false;const s=document.querySelector('#v-raid .scroll'),top=s?s.scrollTop:0;renderRaid();const n=document.querySelector('#v-raid .scroll');if(n)n.scrollTop=top},
  squad:d=>toggleSquad(d.id),
  go:startRaid,
  bmode:d=>setMode(d.m),bundo:undoMove,bnet:catchNow,bend:endTurnBtn,
  bflee:(d,el)=>twoTap(el,'Точно? Добыча пропадёт',()=>{if(!B||B.busy)return;B.over=true;B.result='flee';if(B.input){const I=B.input;B.input=null;I.res()}}),
  nextf:()=>startFight(),
  leave:()=>finishRaid('left'),
};
document.addEventListener('click',e=>{
  const res=e.target.closest('[data-res]');
  if(res&&pendingRes){Coach.on('res');const f=pendingRes;pendingRes=null;f(res.dataset.res);return}
  const a=e.target.closest('[data-act]');
  if(a&&!a.disabled){const fn=ACT[a.dataset.act];if(fn){Coach.on('act:'+a.dataset.act);fn(a.dataset,a)}return}
  const hl=e.target.closest('.hl');
  if(hl){onCell(+hl.dataset.x,+hl.dataset.y);return}
  const board=e.target.closest('#board');
  if(board&&B){
    const r=board.getBoundingClientRect(),c=r.width/W;
    onCell(clamp(Math.floor((e.clientX-r.left)/c),0,W-1),clamp(Math.floor((e.clientY-r.top)/c),0,H-1));
    return;
  }
  if(e.target.id==='sheet')closeSheet();
});
window.addEventListener('resize',()=>{if(B&&current==='v-battle')layoutBoard()});

/* ---------- Запуск ---------- */
function start(data){
  const saved=data&&data.G?{...NEW(),...data.G}:loadLocal();
  if(saved)G=saved;
  normJar();
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({G}));
  Coach.init();
  if(G.tutor)tutorResume();else goHome();
  cloudInit();
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});

</script>
