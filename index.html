<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14302d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Супердихлофос">
<title>Супердихлофос</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=Rubik:wght@400;500;700;900&family=Rubik+Spray+Paint&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}
/* Концепция: этикетка баллона дихлофоса поверх облезлой лабораторной эмали. Один игровой мир, одна тема. */
:root{
  --ink:#17140f; --ground:#14302d; --enamel:#21504b; --enamel-hi:#3a7a73;
  --bone:#f1e7c9; --bone-dim:#c6c09f; --dichlor:#f2bb16; --blood:#e0405d;
  --toxin:#b7dc2e; --water:#61c8e6; --rust:#a4552a;
  --f-spray:'Rubik Spray Paint','Rubik',Impact,'Arial Black',sans-serif;
  --f-ui:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-term:'PT Mono',ui-monospace,Menlo,Consolas,monospace;
  --tape:repeating-linear-gradient(-45deg,var(--dichlor) 0 10px,var(--ink) 10px 20px);
  --cut:7px 11px 8px 10px;
  --cell:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--bone);font:400 15px/1.42 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font-weight:900;font-size:21px;line-height:1.15;text-wrap:balance}
h3{font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--bone-dim)}
svg{display:block;overflow:visible}
#app{height:100%;max-width:520px;margin-inline:auto;position:relative;background:var(--ground)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.tape{height:8px;flex:none;background:var(--tape)}

/* Кнопки как наклейки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.15;text-align:center;border:2.5px solid var(--ink);border-radius:var(--cut);background:var(--bone);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--dichlor);font-weight:900;font-size:16px}
.btn.quiet{background:var(--enamel);color:var(--bone);border-color:var(--enamel-hi);box-shadow:none;font-weight:500;min-height:44px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn small{font-weight:500;font-size:12px;opacity:.85}

/* Шапка базы */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-spray);font-size:27px;line-height:1;color:var(--dichlor);letter-spacing:-.01em}
.res{display:flex;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;background:var(--ink);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.chip svg{width:15px;height:15px}
.term{font:400 13.5px/1.4 var(--f-term);color:var(--dichlor);background:var(--ink);padding:9px 11px;border-radius:var(--cut)}
.term::before{content:"ТЕРМИНАЛ> ";color:var(--bone-dim)}

/* Этикетка питомца */
.tag{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;background:var(--bone);color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--cut);text-align:left;width:100%}
.tag .pic{width:84px;height:84px;background:#d9cda4;border-radius:6px;padding:7px;position:relative}
.tag .pic.itch svg,.tag .pic.itch img{animation:itch .35s linear infinite}
.tag .no{font:400 11px var(--f-term);color:#6c6652}
.tag .nm{font-weight:900;font-size:17px;line-height:1.1}
.tag .rc{font-size:12.5px;color:#57523f}
.stats{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:3px}
.stats b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mchip{font-size:11.5px;font-weight:500;line-height:1.2;padding:2px 6px;border-radius:5px;background:#e0d4a9;color:var(--ink)}
.mchip.t2{background:#bfd8c9}.mchip.t3{background:var(--dichlor)}
.mchip.bad{background:#e7b0ac}.mchip.sup{background:var(--ink);color:var(--dichlor)}
.tox{margin-top:5px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;font-size:11.5px;font-weight:700}
.tox .bar{height:9px;border:2px solid var(--ink);border-radius:3px;background:linear-gradient(90deg,transparent 30%,rgba(224,64,93,.25) 30%);position:relative;overflow:hidden}
.tox .bar i{position:absolute;inset:0 auto 0 0;background:#8fb312}
.tox.hot .bar i{background:var(--blood)}
.tox .pct{font-variant-numeric:tabular-nums}
.sel .tag{opacity:.72}
.tag.on{outline:4px solid var(--dichlor);outline-offset:-1px;opacity:1}

/* Выбор зверя */
.beasts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.beast{display:flex;flex-direction:column;gap:3px;padding:10px;background:var(--bone);color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--cut);text-align:left;box-shadow:0 3px 0 var(--ink)}
.beast:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.beast .pic{height:104px;display:flex;justify-content:center;background:#d9cda4;border-radius:6px;padding:8px}
.beast .pic svg{height:100%;width:auto}
.beast .pic img.mkc{width:auto;max-width:100%}
.beast b{font-weight:900;font-size:16px;line-height:1.1;margin-top:3px}
.beast em{font-style:normal;font-size:12px;font-weight:700;color:var(--rust)}
.beast span{font-size:12px;line-height:1.3;color:#4c4736}
.hero{font-family:var(--f-spray);font-size:38px;line-height:1.02;color:var(--dichlor);text-wrap:balance}

/* Кампания */
.lvl{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border:2.5px solid var(--enamel-hi);border-radius:var(--cut);text-align:left;width:100%}
.lvl .n{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;color:var(--bone-dim)}
.lvl b{display:block;font-weight:700;line-height:1.15}
.lvl small{font-size:12px;color:var(--bone-dim)}
.lvl.on{background:var(--bone);color:var(--ink);border-color:var(--ink)}
.lvl.on small,.lvl.on .n{color:#57523f}
.lvl[disabled]{opacity:.42}
.lvl .st{font-size:11.5px;font-weight:700;white-space:nowrap}

/* Бой */
.b-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:7px 3px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;font-weight:700}
.b-head .ttl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-head button{flex:none;font-size:12px;font-weight:500;color:var(--bone-dim);padding:3px 6px;min-height:28px}
.queue{flex:none;display:flex;gap:4px;align-items:center;padding-block:3px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.qt{flex:none;width:34px;height:34px;padding:3px;border-radius:7px;border:2px solid var(--blood);background:#3b2023}
.qt.pet{border-color:var(--dichlor);background:#3d3414}
.qt.now{width:42px;height:42px;border-width:3px}
.qt.next{opacity:.5}
.qsep{flex:none;width:2px;height:24px;background:var(--bone-dim);opacity:.4;margin-inline:2px}
.board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:calc(var(--cell)*var(--bw,6));height:calc(var(--cell)*var(--bh,8));border:3px solid var(--ink);box-sizing:content-box;border-radius:6px;overflow:hidden;background:var(--t1,#a79a6a)}
.tile{position:absolute;width:var(--cell);height:var(--cell);left:calc(var(--x)*var(--cell));top:calc(var(--y)*var(--cell))}
.tile.alt{background:var(--t2,#9b8e60)}
.tile svg{width:100%;height:100%}
.tile .splat{position:absolute;inset:8%}
.fxc{position:absolute;width:var(--cell);height:var(--cell);left:calc(var(--x)*var(--cell));top:calc(var(--y)*var(--cell));pointer-events:none}
.fxc.gas{background:radial-gradient(circle,rgba(183,220,46,.75),rgba(183,220,46,.25) 70%)}
.fxc.ink{background:radial-gradient(circle,rgba(23,20,15,.8),rgba(23,20,15,.25) 72%)}
.unit{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transform:translate(calc(var(--x)*var(--cell)),calc(var(--y)*var(--cell)));transition:transform .22s cubic-bezier(.3,.7,.3,1);pointer-events:none}
.unit .body{position:absolute;inset:6% 5% 13%}
.unit.foe .body svg,.unit.foe .body .mkwrap{transform:scaleX(-1)}
.unit.cur::before{content:"";position:absolute;inset:auto 7% 2% 7%;height:30%;border-radius:50%;border:3px dashed var(--dichlor);background:rgba(23,20,15,.28)}
.unit.down .body{filter:grayscale(1);opacity:.5;transform:rotate(80deg) scale(.8)}
.unit.gone{display:none}
.unit.hit .body{animation:hit .28s linear}
.hpb{position:absolute;left:6%;right:6%;bottom:2%;height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.hpb i{position:absolute;inset:1px auto 1px 1px;background:var(--dichlor);border-radius:2px}
.foe .hpb i{background:var(--blood)}
.sts{position:absolute;top:0;right:1px;display:flex;gap:1px}
.sts i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.sts .poison{background:var(--toxin)}.sts .blind{background:#333}.sts .stun{background:var(--dichlor)}.sts .rallied{background:var(--water)}
.hl{position:absolute;width:var(--cell);height:var(--cell);left:calc(var(--x)*var(--cell));top:calc(var(--y)*var(--cell));display:grid;place-items:center}
.hl::after{content:"";display:block}
.hl.move::after{width:32%;height:32%;border-radius:50%;background:var(--dichlor);border:2.5px solid var(--ink)}
.hl.atk::after{width:90%;height:90%;border-radius:50%;border:3.5px solid var(--blood);box-shadow:inset 0 0 0 2px var(--ink);animation:pulse 1s ease-in-out infinite}
.hl.net::after{width:90%;height:90%;border-radius:8px;border:3.5px dashed var(--dichlor);animation:pulse 1s ease-in-out infinite}
.hl.abil::after{width:90%;height:90%;border-radius:50%;border:3.5px solid var(--water);box-shadow:inset 0 0 0 2px var(--ink);animation:pulse 1s ease-in-out infinite}
.hl.cell::after{width:86%;height:86%;border-radius:4px;background:rgba(97,200,230,.28);border:2px solid var(--water)}
.flt{position:absolute;left:calc((var(--x) + .5)*var(--cell));top:calc((var(--y) + .1)*var(--cell));transform:translateX(-50%);font-weight:900;font-size:17px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke;white-space:nowrap;pointer-events:none;animation:flt .85s ease-out forwards;z-index:9}
.flt.dmg{color:#ff8097}.flt.heal{color:var(--toxin)}.flt.info{font-size:13px;color:var(--bone)}.flt.big{font-size:21px;color:var(--dichlor)}
.shot{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#e9e2b7;z-index:8;pointer-events:none}
.panel{flex:none;background:var(--ink);padding-block:7px 9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;min-height:138px}
.p-who{display:flex;align-items:center;gap:8px;font-size:13px;min-height:22px}
.p-who b{font-weight:900;font-size:14.5px}
.p-who .hp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--dichlor)}
.p-log{font:400 12.5px/1.32 var(--f-term);color:var(--bone-dim);min-height:34px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.act{flex:1 1 calc(33.3% - 6px);min-width:0;min-height:44px;padding:4px 6px;font-weight:700;font-size:13px;line-height:1.1;border:2.5px solid var(--ink);border-radius:var(--cut);background:var(--bone);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.act.on{background:var(--dichlor);outline:2px solid var(--dichlor);outline-offset:1px}
.act.net{background:var(--toxin)}
.act.end{background:var(--enamel);color:var(--bone);border-color:var(--enamel-hi)}
.act.end.go{background:var(--dichlor);color:var(--ink);border-color:var(--ink)}
.act[disabled]{opacity:.45}
.act i{font-style:normal;font-weight:500;font-size:11px}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(23,20,15,.55);font-family:var(--f-spray);font-size:40px;color:var(--dichlor);text-align:center;z-index:20;pointer-events:none;padding:12px;line-height:1.05}

/* Лаборатория */
.scope{align-self:center;width:min(58vw,210px);aspect-ratio:1;max-width:100%;border-radius:50%;border:9px solid var(--ink);box-shadow:0 0 0 4px var(--rust),inset 0 0 22px rgba(23,20,15,.7);background:#f3c9c6;overflow:hidden;position:relative;display:grid;place-items:center}
.scope .cells{position:absolute;inset:-10%;filter:blur(5px);transition:filter 1.1s ease-out}
.scope.sharp .cells{filter:blur(0)}
.scope .cells i{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--blood);border:3px solid #9c2038;left:var(--l);top:var(--t);animation:drift var(--d) ease-in-out infinite alternate}
.scope .sp{position:relative;width:62%;opacity:0;transform:scale(.6);transition:opacity .4s .9s,transform .5s .9s}
.scope.sharp .sp{opacity:1;transform:none}
.reveal{text-align:center;display:flex;flex-direction:column;gap:3px}
.reveal .big{font-family:var(--f-spray);font-size:33px;line-height:1.05;color:var(--dichlor)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:46px;padding:4px;font-size:13.5px;font-weight:700;line-height:1.12;border:2.5px solid var(--enamel-hi);border-radius:var(--cut);color:var(--bone)}
.seg button.on{background:var(--bone);color:var(--ink);border-color:var(--ink)}
.seg small{display:block;font-size:10.5px;font-weight:700;color:var(--toxin)}
.seg button.on small{color:#4d6406}
.tier{display:flex;flex-direction:column;gap:6px;padding:10px 11px;width:100%;text-align:left;background:var(--bone);color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--cut);box-shadow:0 3px 0 var(--ink)}
.tier:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tier .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tier .hd b{font-weight:900;font-size:17px}
.tier .hd span{font-size:12px;font-weight:700;color:var(--rust);white-space:nowrap}
.tier ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.tier li{font-size:13px;line-height:1.28}
.tier li b{font-weight:700}
.plus{color:#3b6b12;font-weight:500}.minus{color:#a42239;font-weight:500}

/* Квиз */
.quiz{background:var(--ink)}
.pips{display:flex;gap:5px}
.pips i{flex:1;height:7px;border-radius:2px;background:#3a352b}
.pips i.ok{background:var(--toxin)}.pips i.no{background:var(--blood)}.pips i.now{background:var(--dichlor)}
.timer{height:5px;background:#3a352b;border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--dichlor);transform-origin:left}
.qtxt{font-weight:700;font-size:20px;line-height:1.24;text-wrap:balance;user-select:text;-webkit-user-select:text}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:50px;padding:10px 12px;text-align:left;font-weight:500;font-size:15.5px;line-height:1.22;border:2.5px solid var(--bone-dim);border-radius:var(--cut);color:var(--bone)}
.opt.ok{background:var(--toxin);color:var(--ink);border-color:var(--toxin);font-weight:700}
.opt.no{background:var(--blood);color:#fff;border-color:var(--blood)}
.note{font:400 14px/1.42 var(--f-term);color:var(--dichlor);user-select:text;-webkit-user-select:text}

/* Укус */
.bite-card{display:flex;flex-direction:column;gap:7px}
.risk{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;font-weight:500;padding:0 2px}
.risk b{font-variant-numeric:tabular-nums}
.stage{position:relative;align-self:center;width:min(66vw,240px);max-width:100%;aspect-ratio:1;background:var(--bone);border:3px solid var(--ink);border-radius:var(--cut);padding:14%}
.stage .m{position:absolute;width:28%;left:80%;top:-6%;animation:fly-in 1s ease-in forwards}
.stage.bite svg.pet,.stage.bite .petw{animation:itch .3s linear 3}
.card{display:flex;flex-direction:column;gap:6px;padding:11px 12px;background:var(--bone);color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--cut)}
.card h2{color:var(--ink)}
.card p{font-size:14px;line-height:1.36}
.card .fact{font:400 13px/1.4 var(--f-term);color:#4c4736;border-top:2px dashed #b8ad86;padding-top:6px}
.card.sup{background:var(--ink);color:var(--dichlor);border-color:var(--dichlor)}
.card.sup h2{font-family:var(--f-spray);font-weight:400;font-size:27px;color:var(--dichlor)}
.card.sup p{color:var(--bone)}
.card.badc{background:#efc2bb}
.tomb{align-self:center;width:130px}
.big-t{font-family:var(--f-spray);font-size:33px;line-height:1.05;color:var(--dichlor);text-wrap:balance}
.big-t.red{color:var(--blood)}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.sum .chip{font-size:14px;padding:5px 9px}

/* Шторка и кодекс */
#sheet{position:absolute;inset:0;background:rgba(10,20,18,.72);display:flex;align-items:flex-end;z-index:30}
#sheet .in{width:100%;max-height:88%;background:var(--ground);border-top:8px solid transparent;border-image:var(--tape) 8;display:flex;flex-direction:column}
.bigpic{align-self:center;width:150px;height:150px;background:#d9cda4;border:2.5px solid var(--ink);border-radius:var(--cut);padding:12px}
.bigpic.itch svg,.bigpic.itch img{animation:itch .35s linear infinite}
.statgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
.statgrid div{background:var(--ink);border-radius:6px;padding:5px 2px;font-size:10.5px;font-weight:700;color:var(--bone-dim)}
.statgrid b{display:block;font-size:18px;font-weight:900;color:var(--bone);font-variant-numeric:tabular-nums}
.mlist{display:flex;flex-direction:column;gap:7px}
.mline{font-size:13px;line-height:1.3;padding:8px 10px;background:var(--bone);color:var(--ink);border-radius:var(--cut)}
.mline b{font-weight:700;font-size:14px}
.mline .fact{display:block;font:400 12px/1.36 var(--f-term);color:#4c4736;margin-top:3px}
.mline.lock{background:var(--enamel);color:var(--bone-dim)}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;background:var(--bone);color:var(--ink);border:2.5px solid var(--ink);padding:6px 10px;border-radius:var(--cut);font-weight:700;font-size:13px;z-index:40;text-align:center;box-shadow:0 3px 0 var(--ink);width:max-content}

@keyframes itch{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}50%{transform:translate(1.5px,-1px)}75%{transform:translate(-1px,-1px)}}

#qafter .btn{width:100%}
.card h3{color:#6c6652}

.hl.smear::after{border-style:dashed;box-shadow:none}
.queue{min-height:51px}
.odds{display:flex;flex-direction:column;gap:4px;width:100%}
.obar{display:flex;height:10px;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--ink)}

.cnote{font-style:normal;font-size:12.5px;line-height:1.3;color:#1e6b67;font-weight:500}
.card .cnote{font-size:13px}
.rel-good{color:#7fc06a;font-weight:700}
.rel-bad{color:#ff8097;font-weight:700}
.acts.many .act{flex-basis:calc(25% - 6px);min-height:40px;font-size:12px;padding:3px 4px}
.sts .held{background:#7fc6b8}
.risk .minus{color:#ff8097}

/* Запал, уровни, поле */
.mp{display:inline-flex;gap:3px;align-items:center;margin-left:2px}
.mp i{width:9px;height:9px;border-radius:50%;background:#37322a;border:1.5px solid #6c6652}

.cost{display:inline-grid;place-items:center;min-width:17px;height:17px;padding-inline:3px;border-radius:9px;background:var(--ink);color:var(--dichlor);font:700 11.5px/1 var(--f-ui);font-style:normal;font-variant-numeric:tabular-nums}

.hl[data-n]::before{content:attr(data-n);position:absolute;top:0;right:1px;z-index:2;padding:0 3px;border-radius:5px;background:var(--ink);color:#ff8097;font:700 12px/1.25 var(--f-ui)}

@keyframes gasp{50%{background:rgba(183,220,46,.34)}}

@keyframes jolt{20%{transform:translate(-4px,2px)}45%{transform:translate(4px,-3px)}70%{transform:translate(-2px,2px)}}
.sts .bleed{background:var(--blood)}.sts .bruise{background:#7a5a9e}.sts .confused{background:#e98ad0}
.ride{font-size:11.5px;font-weight:500;color:inherit;opacity:.85}
.lvlb,.tox{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:4px;font-size:11.5px;font-weight:700}
.lvlb .bar{height:8px;border:2px solid var(--ink);border-radius:3px;background:#f7efd6;overflow:hidden;display:block}
.lvlb .bar i{display:block;height:100%;background:#3aa5a0}

.perk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:11px 12px;background:var(--bone);color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--cut);box-shadow:0 3px 0 var(--ink);text-align:left}

.perk em{font-style:normal;font-size:11.5px;font-weight:700;color:#1e6b67}
.sq small{display:block;font-size:11.5px;color:#57523f;font-weight:500}
.lvl .mq{display:inline-flex;align-items:center;gap:3px}
.lvl .mq svg{width:13px;height:13px}

.abrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px;-webkit-overflow-scrolling:touch}

.acts .act.net{flex:1.3 1 0}
.p-who{white-space:nowrap;overflow:hidden}
.p-log{max-height:50px;overflow:hidden}

/* Обучение и события */
#plog.tut{color:var(--dichlor)}

/* Прокачка */
.lvb{position:absolute;left:-4px;top:-4px;min-width:24px;height:24px;padding-inline:4px;display:grid;place-items:center;border-radius:12px;background:var(--dichlor);border:2.5px solid var(--ink);color:var(--ink);font:900 13px/1 var(--f-ui);font-variant-numeric:tabular-nums}

.spec{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:10px;background:var(--bone);color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--cut);box-shadow:0 3px 0 var(--ink);text-align:left}

.spec span{font-size:13px;line-height:1.3}
.spec:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.wantspec{color:#a01f35;font-weight:700}

/* Новые мутации и виды */
.fxc.slime{background:radial-gradient(circle,rgba(242,154,176,.7),rgba(242,154,176,.22) 72%)}
.fxc.cheese{background:radial-gradient(circle,rgba(183,220,46,.42),rgba(183,220,46,.06) 72%)}

.sts .fear{background:#fff}.sts .dazzle{background:#61c8e6}.sts .hypno{background:#6b3fa0}.sts .sleep{background:#c6c09f}
.sts .cnt{min-width:11px;height:11px;padding:0 2px;border-radius:6px;border:1.5px solid var(--ink);font:700 8.5px/9px var(--mono,monospace);text-align:center;color:var(--ink);box-sizing:border-box}

.mkwrap{position:absolute;inset:0;pointer-events:none}

/* Сочетания по уровням */
.mchip.ct1{background:#d9d2bd}.mchip.ct2{background:#2f7fc4;color:#fff}.mchip.ct3{background:#7d4fc4;color:#fff}.mchip.ct4{background:#f2bb16;color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.mline.ctier{border-left:5px solid #b8b09a}.mline.ct2{border-left-color:#2f7fc4}.mline.ct3{border-left-color:#7d4fc4}.mline.ct4{border-left-color:#f2bb16}

h3.ctierh.ct2{color:#7fb8ec}h3.ctierh.ct3{color:#c3a2f2}h3.ctierh.ct4{color:#f2bb16}
.card.sup.ct2{border-color:#4aa3e8}.card.sup.ct3{border-color:#b07cf0}.card.sup.ct4{border-color:#f2bb16;box-shadow:0 0 0 3px rgba(242,187,22,.35)}

/* Обучение: подсветка терминала */
#coach{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden}

.ck-blk{position:absolute;pointer-events:auto}
.ck-hole{position:absolute;border-radius:10px;box-shadow:0 0 0 3000px rgba(7,14,12,.68);outline:3px solid var(--dichlor);pointer-events:none;animation:ckpulse 1.3s ease-in-out infinite}
@keyframes ckpulse{50%{outline-color:rgba(242,187,22,.25)}}
.ck-bub{position:absolute;left:12px;right:12px;pointer-events:auto;background:var(--ink);border:2.5px solid var(--dichlor);border-radius:var(--cut);padding:11px 12px 8px;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.ck-t{font:400 14px/1.45 var(--f-term);color:var(--bone);text-wrap:pretty}
.ck-t::before{content:"ТЕРМИНАЛ> ";color:var(--dichlor)}
.ck-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.ck-skip{font-size:12.5px;color:var(--bone-dim);text-decoration:underline;text-underline-offset:2px;min-height:40px;padding:0 4px 0 0;text-align:left}
.ck-go{min-height:42px;padding:6px 18px;flex:none}
.tutsw{flex-direction:column;gap:2px}

/* ---------- Карта из комнат и камера ---------- */
.board-wrap.camv{position:relative;display:block;overflow:hidden;touch-action:none;background:#060b0a;cursor:grab;-webkit-user-select:none;user-select:none}
.board-wrap.camv.drag{cursor:grabbing}
#cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.board.mapb{border:0;border-radius:0;background:transparent;overflow:visible}

.mobj{position:absolute;left:calc(var(--x)*var(--cell));top:calc(var(--y)*var(--cell));width:var(--cell);height:calc(var(--h)*var(--cell));max-width:none;pointer-events:none;-webkit-user-drag:none}
.fog{position:absolute;left:calc(var(--x)*var(--cell) - 1px);top:calc(var(--y)*var(--cell) - 1px);width:calc(var(--cell) + 2px);height:calc(var(--cell) + 2px);pointer-events:none;transition:opacity .5s;
  background:#0a1311 url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Cpath d='M-6 6L6 -6M-6 30L30 -6M18 30L30 18' stroke='%2316302b' stroke-width='3.2'/%3E%3C/svg%3E");
  background-position:calc(1px - var(--x)*var(--cell)) calc(1px - var(--y)*var(--cell))}

.board.mapb .shot{z-index:505}

.hl.use::after{width:88%;height:88%;border-radius:10px;border:3.5px dashed var(--dichlor);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink);animation:pulse 1s ease-in-out infinite}
#arrows{position:absolute;inset:0;pointer-events:none;z-index:30}
.arrow{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--blood);color:var(--bone);display:grid;place-items:center;box-shadow:0 2px 0 var(--ink);pointer-events:auto;border:2px solid var(--ink);padding:0}
.arrow.pet{background:var(--dichlor);color:var(--ink)}
.arrow.mq{background:var(--bone);color:var(--ink)}
.arrow svg{width:16px;height:16px;pointer-events:none}

.bloods{display:flex;flex-direction:column;gap:8px}

/* Статусы панды и мартышки */
.sts .shame{background:#f29ab0}.sts .hug{background:#ece6d6}.sts .bamboo{background:#7fa83a}.sts .guard{background:#9aa597}
.sts .naezd{background:#e0405d;box-shadow:inset 0 0 0 2px #fbf6e6}.sts .cocoon{background:#f7f1e2}.sts .glow{background:#7ff0ff;box-shadow:0 0 4px #7ff0ff}.sts .prey{background:#e98a1e;box-shadow:inset 0 0 0 2px #14100c}.sts .contused{background:#b9cb5c}.sts .smiled{background:#f6b3c6}.sts .monster{background:#6b3fa0}
.unit.cocoon .body{filter:grayscale(1) brightness(1.55) contrast(.8)}.unit.cocoon .body::after{content:'';position:absolute;inset:18% 12% 6%;border-radius:45%;background:repeating-linear-gradient(-28deg,rgba(247,241,226,.85) 0 3px,rgba(247,241,226,.25) 3px 7px);border:1.5px solid var(--ink);pointer-events:none}.sts .snarl{background:#f1e7c9}.sts .cnt.pump{background:#e0405d;color:#fff}
.abrow.more{-webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent)}

<script>/* ---------- Звери ---------- */
const RACES={
  panda:{name:'Панда',role:'Танк',hp:18,atk:2,mov:3,init:4,range:1,mp:[2,4,1],tags:['redbook'],abil:['shove','bamboo','hug'],trait:'Краснокнижная: кто её ударит, 2 хода бьёт на 1 слабее. Бамбук вместо удара лечит 3 ОЗ и бережёт до её хода. Обнимашки держат врага рядом: он не уйдёт и бьёт только её.'},
  monkey:{name:'Мартышка',role:'Поддержка',hp:10,atk:2,mov:4,init:7,range:3,mp:[3,6,2],tags:['thrower'],abil:['shove','banana','peel','mimic'],trait:'Кидается чем попало на 3 клетки. Банан лечит союзника или бьёт врага, кожура роняет любого, кто наступит. Обезьянничает: повторяет последний приём союзника дешевле.'},
  medoed:{name:'Медоед',role:'Задира',hp:13,atk:4,mov:3,init:6,range:1,mp:[2,4,1],tags:['poisonResist','ignoreFirst','zadira'],abil:['shove','naezd'],trait:'Всё равно: яд действует вдвое короче, первый дебафф в бою не действует. Задира: кто сейчас крупнее его по ОЗ, того бьёт на 1 сильнее, кто мельче, на 1 слабее. Наезд: выбирает врага, вслепую идёт за ним, когда тот ходит, и, догнав, кусает.'},
  jackal:{name:'Шакал',role:'Ближний бой',hp:11,atk:4,mov:4,init:8,range:1,mp:[2,5,2],tags:['scavenger'],abil:['shove','dash'],trait:'Падальщик: лечит 3 ОЗ, когда добивает врага. Рывком прыгает к цели и кусает.'},
  camel:{name:'Верблюд',role:'Дальний бой',hp:12,atk:3,mov:3,init:6,range:4,mp:[3,5,2],tags:['hump'],abil:['shove','blindspit'],trait:'Плюётся на 4 клетки, может плюнуть в глаза. Жир в горбе лечит 3 ОЗ между боями.'},
  rooster:{name:'Петух',role:'Саппорт',hp:9,atk:2,mov:3,init:7,range:1,mp:[4,7,3],tags:[],abil:['shove','crow','rally'],trait:'Больше всех запала. Кукареканьем лечит союзников и поднимает их в очереди.'},
  raccoon:{name:'Енот',role:'Ловец',hp:12,atk:3,mov:4,init:8,range:1,mp:[2,4,2],tags:['longCatch'],abil:['shove'],trait:'Цепкие лапы: ловит комаров через клетку.'},
  egg:{name:'Яйцо',hp:3,atk:1,mov:1,init:1,range:1,tags:[]},
  termite:{name:'Термит',art:'roach',hp:1,atk:1,mov:3,init:4,range:1,tags:[]},
  barrel:{name:'Бочка дихлофоса',hp:1,atk:0,mov:0,init:0,range:0,tags:[],info:'Рванёт от удара или толчка: 3 урона вокруг и облако газа.'},
  /* Враги */

const FORM_BY_ID=Object.fromEntries(Object.values(FORMS).flatMap(t=>Object.values(t)).map(f=>[f.id,f]));
function formsOf(race,muts){
  const t=FORMS[race];if(!t)return[];
  const cnt={},seq=[];
  (muts||[]).forEach(id=>{const m=MUT[id];if(!m||m.sp===OWN_BLOOD[race]||!t[m.sp])return;cnt[m.sp]=(cnt[m.sp]||0)+1;if(cnt[m.sp]===2)seq.push(m.sp)});
  return seq.map((sp,i)=>({...t[sp],sp,lv3:cnt[sp]>=3,n:cnt[sp],i}));
}
/* Имя и вид даёт группа, где мутаций больше, при равенстве та, что открылась первой */
const mainForm=(race,muts)=>{const f=formsOf(race,muts);return f.length?[...f].sort((a,b)=>b.n-a.n||a.i-b.i)[0]:null};

const MarkerCamel=(()=>{

  const n1=x=>Math.round(x*10)/10;

    const n=pts.length,out=[];

    const segs=closed?n:n-1;

      const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
      const m1=p1[2]==='c'?[0,0]:[(p2[0]-p0[0])*tn,(p2[1]-p0[1])*tn];
      const m2=p2[2]==='c'?[0,0]:[(p3[0]-p1[0])*tn,(p3[1]-p1[1])*tn];
      const len=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]),k=Math.max(2,Math.round(len/step));

        out.push([a*p1[0]+b*m1[0]+c*p2[0]+d*m2[0],a*p1[1]+b*m1[1]+c*p2[1]+d*m2[1]])}
    }

  const normals=(s,closed)=>s.map((p,i)=>{const a=s[closed?(i-1+s.length)%s.length:Math.max(0,i-1)],b=s[closed?(i+1)%s.length:Math.min(s.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[-dy/l,dx/l]});

  const fix=p=>{p.muts=[...new Set((p.muts||[]).map(id=>GONE_MUT[id]||id))];p.combos=findCombos(p.race,p.muts);(p.muts||[]).forEach(id=>{if(g.codexM)g.codexM[id]=1});formsOf(p.race,p.muts).forEach(f=>{g.codexF=g.codexF||{};g.codexF[f.id]=1})};
  g.codexC=g.codexC||{};for(const k in g.codexC)if(!COMBO[k])delete g.codexC[k];
  const keep=p=>(p.combos||[]).forEach(id=>{if(COMBO[id])g.codexC[id]=1});
  (g.pets||[]).forEach(fix);(g.fugitives||[]).forEach(fix);(g.pets||[]).forEach(keep);(g.grave||[]).forEach(x=>{if(x.muts)x.muts=[...new Set(x.muts.map(id=>GONE_MUT[id]||id))]});
  if(g.codexM){delete g.codexM.firefly;delete g.codexM.flattail}
  return g;
}
/* Медоед стал задирой: выученные приёмы и путь танка переводим на новые */
const MED_SWAP={roar:'naezd',hardhide:'snarl',badbite:'psych',dontcare:'brawl',slam:'badbite'},MED_SPEC={bunker:'grudge',bouncer:'madman'};
function fixMedoed(g){
  const fix=p=>{if(!p||p.race!=='medoed')return;['learned','cheap','plus'].forEach(k=>{if(Array.isArray(p[k]))p[k]=[...new Set(p[k].map(id=>MED_SWAP[id]||id))]});if(p.spec&&MED_SPEC[p.spec])p.spec=MED_SPEC[p.spec]};
  (g.pets||[]).forEach(fix);(g.fugitives||[]).forEach(fix);
}
function migrate(g){
  if(!g)return null;
  if(g.v===SAVE_V)return{...NEW(),...g};
  if(g.v>=1&&g.v<8)fixMedoed(g);
  if(g.v===7){g.v=SAVE_V;return{...NEW(),...g}}
  if(g.v===6||g.v===5){fixGone(g);g.v=SAVE_V;return{...NEW(),...g}}
  if(g.v===4||g.v===3){(g.pets||[]).forEach(petDefaults);(g.fugitives||[]).forEach(petDefaults);if(g.v===3)g.tutDone=oldHand(g);fixGone(g);g.v=SAVE_V;return{...NEW(),...g}}
  if(g.v===2){(g.pets||[]).forEach(petDefaults);(g.fugitives||[]).forEach(petDefaults);g.tutDone=oldHand(g);fixGone(g);g.v=SAVE_V;return{...NEW(),...g}}
  if(g.v!==1)return null;
  g.codexM={};g.codexC={};
  const fix=p=>{
    p.muts=[...new Set((p.muts||[]).map(id=>MUT[id]?id:OLDMAP[id]).filter(Boolean))];
    p.combos=findCombos(p.race,p.muts);
    p.muts.forEach(id=>g.codexM[id]=1);p.combos.forEach(id=>g.codexC[id]=1);
    return p;
  };
  (g.pets||[]).forEach(p=>petDefaults(fix(p)));(g.fugitives||[]).forEach(p=>petDefaults(fix(p)));
  if(g.slide)g.slide=OLDSP[g.slide]||'moll';
  if(g.pending)g.pending.sp=OLDSP[g.pending.sp]||'moll';
  g.tutDone=oldHand(g);
  fixGone(g);
  g.v=SAVE_V;
  return{...NEW(),...g};
}
function loadLocal(){try{const s=localStorage.getItem(SAVE_KEY);if(s)return migrate(JSON.parse(s))}catch(e){}return null}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const ref=db.collection('data/users/'+id).doc('save');
    const snap=await ref.get();
    cloudRef=ref;
    const d=snap.exists?snap.data():null;
    if(d&&d.updated>G.updated&&!G.sandbox&&(current==='v-base'||current==='v-start')){
      const g=migrate(JSON.parse(d.json));
      if(g){G=g;save();if(G.tutor)tutorResume();else goHome()}
    }else if(G.updated&&(!d||G.updated>d.updated))cloudFlush();
  }catch(e){}
}

/* ---------- Правила питомцев ---------- */
/* Класс читает метку мутации: сильная сторона усиливает бонус, слабая режет его. С чистыми дебаффами наоборот. */
const STRONG={medoed:['atk'],jackal:['atk','mov'],camel:['sense'],rooster:['sup'],panda:['def'],monkey:['sup']};
const WEAK={medoed:['sup'],jackal:['def'],camel:['atk'],rooster:['atk'],panda:['mov'],monkey:['def']};
function classStats(race,m){
  const out={...(m.s||{})},t=m.tag,st=(STRONG[race]||[]).includes(t),wk=(WEAK[race]||[]).includes(t);
  if(m.k==='bad'){for(const k in out){if(out[k]<0){if(st)out[k]+=1;else if(wk)out[k]-=1}}return out}
  if(race==='panda'){if(t==='def'&&out.hp>0)out.hp=Math.ceil(out.hp*1.5);if(t==='mov'&&out.mov>0)out.mov=0}
  if(race==='medoed'&&t==='atk'){if(out.hp<0)out.hp+=1;if(out.mov<0)out.mov+=1}
  if(race==='monkey'&&t==='def'&&out.hp>0)out.hp=Math.floor(out.hp/2);
  if(race==='jackal'){if(t==='atk'&&out.atk>0)out.atk+=1;if(t==='mov'&&out.mov>0)out.mov+=1;if(t==='def'&&out.hp>0)out.hp=Math.floor(out.hp/2)}
  if(race==='camel'&&t==='sense')out.range=(out.range||0)+1;
  if(race==='rooster'&&t==='atk'&&out.atk>0)out.atk=Math.floor(out.atk/2);
  return out;
}
function classNote(race,m){
  const n=RACES[race]?.name,t=m.tag,s=m.s||{};
  if(!REL[race])return'';
  if((STRONG[race]||[]).includes(t)){
    if(m.k==='bad')return s&&Object.keys(s).length?`${n} переносит это легче: штрафа нет.`:'';
    if(race==='medoed')return(s.hp<0||s.mov<0)?'Медоеду всё равно: минус к ОЗ и ходу на 1 меньше.':'';
    if(race==='jackal')return(s.atk>0||s.mov>0)?'Шакал получает ещё +1 к этому бонусу.':'';
    if(race==='camel')return'Верблюд получает ещё +1 к дальности.';
    if(race==='rooster')return'Петух усиливает поддержку: дальше на клетку и на 1 запал дешевле.';
    if(race==='panda')return(s.hp>0||t==='def')?'Панда усиливает защиту: бонус к ОЗ в полтора раза больше.':'';
    if(race==='monkey')return'Мартышка усиливает поддержку: такие приёмы на 1 запал дешевле.';
  }
  if((WEAK[race]||[]).includes(t)){
    if(m.k==='bad')return s&&Object.keys(s).length?`${n} переносит это тяжелее: штраф больше на 1.`:'';
    if(race==='medoed'&&m.abil)return'Медоеду на других всё равно: этот приём ему на 1 запал дороже.';
    if(race==='jackal'&&s.hp>0)return'Шакалу бонус к ОЗ вдвое меньше.';
    if(race==='camel')return'Верблюду неудобно бить в упор: такие удары на 1 слабее.';
    if(race==='rooster'&&s.atk>0)return'Петуху бонус к атаке вдвое меньше.';
    if(race==='panda'&&s.mov>0)return'Панде бонус к ходу не помогает.';
    if(race==='monkey'&&s.hp>0)return'Мартышке бонус к ОЗ вдвое меньше.';
  }
  return'';
}
function statsOf(race,muts=[],combos=[],debuffs=[],pet=null){
  const r=RACES[race],mp=r.mp||[0,0,0],s={hp:r.hp,atk:r.atk,mov:r.mov,init:r.init,range:r.range,mpStart:mp[0],mpMax:mp[1],mpReg:mp[2],crit:REL[race]?.08:.05,tags:new Set(r.tags||[]),abil:[...(r.abil||[])]};
  const addS=o=>{for(const k in o)s[k]+=o[k]};
  if(pet){
    for(let l=2;l<=(pet.lvl||1);l++)addS(growAt(race,l));
    addS(pet.boost||{});
    (pet.learned||[]).forEach(id=>s.abil.push(id));
    (pet.ptags||[]).forEach(t=>s.tags.add(t));
    const sp=specOf(race,pet.spec);
    if(sp){addS(sp.s||{});(sp.tags||[]).forEach(t=>s.tags.add(t))}
  }
  const add=m=>{if(!m)return;(m.tags||[]).forEach(t=>s.tags.add(t));if(m.abil)s.abil.push(m.abil)};
  muts.forEach(id=>{const m=MUT[id];if(!m)return;addS(classStats(race,m));add(m)});
  debuffs.forEach(id=>{const m=DEBUFFS[id];if(m){addS(m.s||{});add(m)}});
  const cs=combos.map(id=>COMBO[id]).filter(Boolean);
  cs.forEach(c=>{addS(c.s||{});add(c)});
  cs.forEach(c=>{(c.rm||[]).forEach(t=>s.tags.delete(t));if(c.rmAbil)s.abil=s.abil.filter(a=>!c.rmAbil.includes(a))});
  formsOf(race,muts).forEach(f=>{
    addS(f.s||{});(f.tags||[]).forEach(t=>s.tags.add(t));(f.rm||[]).forEach(t=>s.tags.delete(t));if(f.abil)s.abil.push(f.abil);if(f.rmAbil)s.abil=s.abil.filter(a=>!f.rmAbil.includes(a));
    /* Пандере бонусы мутаций к ходу снова работают: у обычной панды они гаснут */
    if((f.tags||[]).includes('pandaMov'))muts.forEach(id=>{const m=MUT[id];if(m&&m.tag==='mov'&&m.k!=='bad'&&m.s&&m.s.mov>0)s.mov+=m.s.mov});
    if(f.lv3){addS(f.s3||{});(f.tags3||[]).forEach(t=>s.tags.add(t));if(f.abil3)s.abil.push(f.abil3)}
  });
  /* «Всегда» из сочетаний сильнее видов */
  cs.forEach(c=>{if(c.set)for(const k in c.set)s[k]=c.set[k]});
  if(s.tags.has('noShove'))s.abil=s.abil.filter(a=>a!=='shove');
  if(s.tags.has('eyes5')&&s.range>=2)s.range+=1;
  if(s.tags.has('reach')&&s.range<2)s.range=2;
  s.hp=Math.max(3,s.hp);s.atk=Math.max(1,s.atk);s.mov=Math.max(1,s.mov);s.init=Math.max(1,s.init);s.range=clamp(s.range,1,6);
  if(s.tags.has('melee1'))s.range=1;
  s.abil=[...new Set(s.abil)];
  return s;
}
const petStats=p=>statsOf(p.race,p.muts,p.combos,p.debuffs,p);
const overCap=p=>Math.max(0,p.muts.length+1-mutCap(p.lvl||1));
function findCombos(race,muts){
  const has=id=>muts.includes(id),c=statsOf(race,muts);
  return COMBOS.filter(x=>x.need(has,c,race)).map(x=>x.id);
}
const debuffCount=p=>p.debuffs.length+p.muts.filter(id=>MUT[id]&&MUT[id].k==='bad').length;
function petScore(p){
  let v=0;
  p.muts.forEach(id=>{const m=MUT[id];if(m)v+=m.k==='bad'?-15:RARITY[m.t].pts});
  p.combos.forEach(id=>{if(COMBO[id])v+=40+30*COMBO[id].tier});
  v-=15*p.debuffs.length;
  v+=5*((p.lvl||1)-1)+5*(p.legend||0);
  return Math.max(0,v);
}
const psychoChance=t=>t<=30?0:Math.min(.9,Math.pow((t-30)/70,1.5)*.9);
/* Перегруз: мутаций больше, чем выдерживает уровень. Каждая лишняя +25% к смерти, токсинов в полтора раза больше. */
const deathChance=(tier,pur,p)=>Math.min(.9,(TIERS[tier].death*(1.1-.9*pur)+debuffCount(p)*1.5)/100+.25*overCap(p));
const toxGain=(p,sp,tier,pur)=>Math.round(TIERS[tier].tox*(1.3-.6*pur)*relMul(relOf(p.race,sp))*(overCap(p)?1.5:1)*(petStats(p).tags.has('fangTox')?1.25:1));
const fallDeath=deb=>Math.min(.85,.02+.07*Math.max(0,deb-1));
const dayTheme=()=>['bio','his','sci'][Math.floor(Date.now()/864e5)%3];
function rollMutation(p,sp,tier){
  const r=Math.random(),o=TIERS[tier].odds,want=r<o[0]?1:r<o[0]+o[1]?2:3;
  for(const t of [want,want===1?2:want-1,want===3?1:3]){
    const opts=MUTS.filter(m=>m.sp===sp&&m.t===t&&!p.muts.includes(m.id));
    if(opts.length)return pick(opts);
  }
  return null;
}
function makePet(race){
  const used=new Set([...G.pets,...G.fugitives].map(p=>p.name));
  const free=NAMES.filter(n=>!used.has(n));
  return{id:G.seq,no:G.seq++,name:pick(free.length?free:NAMES),race,muts:[],combos:[],debuffs:[],tox:0,lvl:1,xp:0,boost:{},learned:[],cheap:[],plus:[],ptags:[],legend:0,spec:null};
}
function grantMutation(p,id,quiet){
  const fb=formsOf(p.race,p.muts).map(f=>f.id);
  if(p.muts.includes(id))return[];
  p.muts.push(id);G.codexM[id]=1;
  formsOf(p.race,p.muts).forEach(f=>{G.codexF=G.codexF||{};G.codexF[f.id]=1});
  if(!quiet){const nf=formsOf(p.race,p.muts).find(f=>!fb.includes(f.id));if(nf&&typeof toast==='function')toast(`${p.name}: новый вид, ${nf.name}`)}
  const now=findCombos(p.race,p.muts),fresh=now.filter(c=>!p.combos.includes(c));
  p.combos=now;fresh.forEach(c=>G.codexC[c]=1);
  return fresh;
}

const formLine=f=>`<div class="mline formline"><b>Вид: ${f.name}</b> · ${f.role}<br><span class="plus">${f.plus}.</span> <span class="minus">${f.minus}.</span>${f.lv3?`<br><span class="plus">Третья мутация: ${f.third}.</span>`:`<br><i class="cnote">Третья мутация этой крови усилит вид.</i>`}</div>`;

const mutLine=(m,race)=>{const n=race?classNote(race,m):'';return `<div class="mline"><b>${m.name}</b> · ${RARITY[m.t].name.toLowerCase()}<br>${m.plus?`<span class="plus">${m.plus}.</span> `:''}${m.minus?`<span class="minus">${m.minus}.</span>`:''}${n?`<br><i class="cnote">${n}</i>`:''}<span class="fact">${m.fact}</span></div>`};
/* Сочетания: строка в кодексе и в карточке, подсказки по частям, которые уже есть у зверей */
const comboReqName=q=>Array.isArray(q)?q.map(id=>MUT[id].name).join(' или '):MUT[q].name;
const comboRecipe=c=>(c.race?RACES[c.race].name+' + ':'')+c.req.map(comboReqName).join(' + ');
const comboLine=c=>`<div class="mline ctier ct${c.tier}"><b>${c.name}</b> · ${COMBO_TIER[c.tier].toLowerCase()}${c.fuse?', слияние':''}<br><span class="plus">${c.plus}.</span> <span class="minus">${c.minus}.</span><span class="fact">${comboRecipe(c)}</span></div>`;
function comboHints(){
  const out=[],seen=new Set();
  (G.pets||[]).forEach(p=>{
    const has=id=>p.muts.includes(id);
    COMBOS.forEach(c=>{
      if(G.codexC[c.id]||seen.has(c.id)||(c.race&&c.race!==p.race))return;
      const ok=c.req.map(q=>Array.isArray(q)?q.some(has):has(q)),got=ok.filter(Boolean).length,miss=ok.length-got;
      if(!got||!miss||miss>(c.req.length>=4?2:1))return;
      seen.add(c.id);
      const blood=q=>[...new Set([].concat(q).map(id=>SPECIES[MUT[id].sp].name.toLowerCase()))].join(' или ');
      out.push({c,miss,txt:(c.race?RACES[c.race].name+' + ':'')+c.req.map((q,i)=>ok[i]?comboReqName(q):`??? (${blood(q)})`).join(' + ')+(c.fuse?`, срастутся: ${c.fuse}`:'')});
    });
  });
  return out;
}

    return `<h3 class="ctierh ct${t}">${COMBO_TIERS[t]} · ${f.length} из ${all.length}</h3><div class="mlist">${f.map(comboLine).join('')}${h.map(x=>`<div class="mline lock hint">Подсказка: ${x.txt}${x.n>1?` · таких сочетаний ${x.n}`:''}</div>`).join('')}${!f.length&&!h.length?'<div class="mline lock">Пока ни одного.</div>':''}</div>`};
  openSheet(`<h2>Кодекс</h2><p>Здесь копится всё, что ты открыл. Скрытые сочетания нигде не описаны, на них можно только наткнуться. У каждого есть плюс и минус. Если у зверя уже есть часть сочетания, здесь появится подсказка.</p>
    <h2 class="sub">Скрытые сочетания</h2>${[1,2,3,4].map(tierBlock).join('')}

async function funeral(p,cause){
  removePet(p);
  const best=[...p.muts].filter(id=>MUT[id]&&MUT[id].k!=='bad').sort((a,b)=>MUT[b].t-MUT[a].t)[0];
  const text=epitaph();
  G.grave.unshift({name:p.name,race:p.race,n:p.muts.length,text:`${cause} ${text}`});
  let freebie=null;
  if(!G.pets.length){freebie=makePet(pick(STARTERS));G.pets.push(freebie)}
  const heirs=best?G.pets.filter(x=>!x.muts.includes(best)):[];
  save();
  $('#v-pick').innerHTML=`<div class="tape"></div><div class="scroll">
    <div class="tomb">${OBST.tomb}</div><div class="big-t red">${esc(p.name)} погиб</div>
    <div class="term">${esc(cause)} ${esc(text)}</div>
    ${freebie?`<p>Зоопарк опустел, но на запах еды прибился ${RACES[freebie.race].name.toLowerCase()} ${esc(freebie.name)}.</p>`:''}
    ${heirs.length?`<h3>Кому оставить мутацию «${MUT[best].name}»?</h3>${heirs.map(x=>petTag(x,{act:'none'}).replace('data-act="none"',`data-res="${x.id}"`)).join('')}`:'<button class="btn main" data-res="0">Дальше</button>'}
  </div>`;
  show('v-pick');
  const r=await ask();
  const heir=getPet(r);
  if(heir&&best){const fresh=grantMutation(heir,best);save();if(fresh.length)await superReveal(fresh,heir)}
}

const alliesOf=u=>B.units.filter(x=>alive(x)&&x.side===u.side&&x.kind!=='mosq'&&x.kind!=='husk');

  const fly=u.tags.has('fly')||u.hopNow,mov=moveOf(u),out=new Map(),best=new Map([[key(u.x,u.y),0]]),q=[[u.x,u.y,0]];
  if(u.st.held>0||u.riding)return out;

    const[x,y,d]=q.splice(bi,1)[0],k=key(x,y);

}
function pathMap(u,t){

function abRange(u,id){

  hide:{name:'Спрятаться',cost:2,target:'self',desc:'Весь урон вдвое меньше до следующего хода.',run:async u=>{u.st.hide=1;if(u.tags.has('hideLock'))u.stickNext=true;flt(u,'спрятался','info');await wait(200)}},
  ink:{name:'Чернила',sup:true,cost:3,target:'cell',range:3,desc:'Слепит всех на выбранной клетке и вокруг неё, своих тоже.',run:async(u,c)=>{await shot(u,c,'#26222e');around(c.x,c.y,1).forEach(p=>{B.fx[key(p.x,p.y)]={type:'ink',ttl:1};const o=unitAt(p.x,p.y);if(o&&o.kind!=='barrel'&&!(u.tags.has('inkSafe')&&o.side===u.side))applyStatus(o,'blind',2)});renderFx()}},
  clam:{name:'Захлопнуть',cost:3,target:'enemy',range:1,desc:'Двойной урон, цель не ходит 2 хода. Сам стоит до следующего хода.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u)*2,{src:u,melee:true});if(alive(t))applyStatus(t,'held',2);u.st.held=2}},
  scorpion:{name:'Ужалить',cost:3,target:'enemy',range:2,los:true,desc:'Урон и яд на 3 хода, бьёт с 2 клеток.',run:async(u,t)=>{await lunge(u,t);damage(t,u.atk,{src:u,melee:dist(u,t)<=1});if(alive(t))applyStatus(t,'poison',3)}},
  cobra:{name:'Раздуться',cost:2,target:'self',desc:'Соседние враги отлетают на клетку и слепнут на ход.',run:async u=>{flt(u,'ШШШ','big');await wait(150);(u.tags.has('cobra2')?enemiesOf(u).filter(o=>dist(u,o)<=2):DIRS.map(([a,b])=>unitAt(u.x+a,u.y+b)).filter(o=>o&&enemiesOf(u).includes(o))).filter(o=>o.kind!=='mosq').forEach(o=>{applyStatus(o,'blind',1);if(alive(o))pushUnit(o,u,1)})}},
  dive:{name:'Пике',cost:3,target:'enemy',range:4,lands:true,desc:'Падает на цель с 4 клеток: АТК+3.',run:async(u,t)=>{await leapTo(u,t);const cr=u.tags.has('diveCrit');damage(t,cr?Math.ceil((u.atk+3)*1.5):u.atk+3,{src:u,melee:true,crit:cr});if(alive(t)&&u.tags.has('diveVenom'))applyStatus(t,'poison',3);if(alive(u))stepHazard(u)}},
  hop:{name:'Прыжок',cost:1,target:'cell',cellFree:true,range:4,desc:'Прыгает на 4 клетки через препятствия. Обычный шаг остаётся.',run:async(u,c)=>{u.x=c.x;u.y=c.y;u.movedTurn=true;syncUnit(u);await wait(200);stepHazard(u)}},
  grab:{name:'Схватить',cost:3,target:'enemy',range:1,needStill:true,desc:'Двойной урон, цель не ходит ход. Только если ещё не двигался.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u)*2,{src:u,melee:true});if(alive(t))applyStatus(t,'held',1)}},
  sting:{name:'Жало',cost:3,target:'enemy',range:1,desc:'Тройной урон в упор. 35% упасть самому.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u)*3,{src:u,melee:true});if(alive(u)&&!u.tags.has('safeSting')&&chance(.35)){flt(u,'жало застряло','big');u.hp=0;fall(u,null)}}},
  tongue:{name:'Язык',cost:3,target:'enemy',range:5,line:true,los:true,desc:'Тянет цель с 5 клеток, АТК+1. Следующий ход пропускает.',run:async(u,t)=>{dragTo(u,t);await wait(200);damage(t,u.atk+1,{src:u});if(!u.tags.has('tongueFree'))u.st.stun=1}},
  egg:{name:'Яйцо',sup:true,once:true,cost:3,target:'cell',cellFree:true,range:1,desc:'Раз за бой: сносит яйцо рядом, через 2 раунда вылупится детёныш. Следующий ход пропускает.',run:async(u,c)=>{
    const e=mkUnit('egg','pet','egg',{name:'Яйцо'});e.x=c.x;e.y=c.y;e.parent=u.race;e.pw={max:u.max,atk:u.atk,mov:u.mov,range:u.range,init:u.init};e.hatch=2;B.units.push(e);addDom(e);
    flt(e,'снёс!','big');
    if(u.tags.has('fastEgg'))hatch(e);else u.st.stun=1;
    await wait(220);
  }},
  /* Приёмы классов: открываются на 3-м и 6-м уровне */
  badbite:{name:'Укус за самое дорогое',cost:3,target:'enemy',range:1,desc:'Урон, и цель пропускает ход.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u)+(hasPlus(u,'badbite')?2:0),{src:u,melee:true});if(alive(t))applyStatus(t,'stun',1)}},
  hardhide:{name:'Сжаться',cost:2,target:'self',desc:'Следующий удар по нему не пройдёт.',run:async u=>{u.shield=(u.shield||0)+(hasPlus(u,'hardhide')?2:1);flt(u,'сжался','info');await wait(200)}},
  dontcare:{name:'Мне всё равно',cost:1,target:'self',desc:'Снимает с себя яд, кровотечение, слепоту, синяк, спутанность и обездвиживание.',run:async u=>{['poison','bleed','blind','bruise','confused','held'].forEach(k=>u.st[k]=0);u.bleedT=0;if(hasPlus(u,'dontcare'))heal(u,3);flt(u,'всё равно','big');syncUnit(u);await wait(200)}},
  slam:{name:'Сокрушить',cost:3,target:'enemy',range:1,desc:'АТК+1, синяк на 2 хода и отброс на 2 клетки.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u)+(hasPlus(u,'slam')?2:1),{src:u,melee:true});if(alive(t))applyStatus(t,'bruise',hasPlus(u,'slam')?3:2);if(alive(t))pushUnit(t,u,2)}},
  rip:{name:'Рвать',cost:2,target:'enemy',range:1,desc:'Урон и кровотечение на 3 хода: 1, потом 2, потом 3 урона. Лечение его останавливает.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u),{src:u,melee:true});if(alive(t))applyStatus(t,'bleed',hasPlus(u,'rip')?4:3)}},
  snatch:{name:'Цапнуть и смыться',cost:2,target:'enemy',range:1,desc:'Урон, потом отскакивает от цели на 2 клетки.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u),{src:u,melee:true});if(!alive(u))return;const dx=Math.sign(u.x-t.x),dy=Math.sign(u.y-t.y);for(let i=0;i<(hasPlus(u,'snatch')?3:2);i++){const x=u.x+dx,y=u.y+dy;if(!inB(x,y)||B.rocks.has(key(x,y))||unitAt(x,y))break;u.x=x;u.y=y}u.movedTurn=true;syncUnit(u);await wait(190);stepHazard(u)}},
  finish:{name:'Добить',cost:3,target:'enemy',range:1,desc:'Двойной урон, если у цели половина ОЗ или меньше. Иначе обычный.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u)*((hasPlus(u,'finish')?t.hp*3<=t.max*2:t.hp*2<=t.max)?2:1),{src:u,melee:true})}},
  pack:{name:'Стая',cost:3,target:'self',desc:'Все союзники, и он сам, следующий удар наносят на 1 сильнее.',run:async u=>{flt(u,'АУУУ','big');alliesOf(u).forEach(a=>{a.st.rallied=1;if(hasPlus(u,'pack')&&a.mpMax)a.mp=Math.min(a.mpMax,a.mp+1);syncUnit(a)});await wait(200)}},
  volley:{name:'Залп',cost:3,target:'enemy',rangeAtk:true,los:true,desc:'Плевок по цели, соседние с ней враги получают половину.',run:async(u,t)=>{await shot(u,t);const x=t.x,y=t.y;damage(t,u.atk,{src:u});DIRS.forEach(([a,b])=>{const o=unitAt(x+a,y+b);if(o&&o!==u&&enemiesOf(u).includes(o))damage(o,hasPlus(u,'volley')?u.atk:Math.ceil(u.atk/2),{src:u})})}},
  spitpush:{name:'Плевок-таран',cost:2,target:'enemy',rangeAtk:true,line:true,los:true,desc:'По прямой: АТК−1 и отброс на 2 клетки.',run:async(u,t)=>{await shot(u,t);damage(t,Math.max(1,u.atk-1),{src:u});if(alive(t))pushUnit(t,u,hasPlus(u,'spitpush')?3:2)}},
  puddle:{name:'Лужа слюны',cost:3,target:'cell',range:4,desc:'Облако газа вокруг выбранной клетки на 2 раунда. Своих тоже травит.',run:async(u,c)=>{await shot(u,c,'#b7dc2e');cloud(c.x,c.y,1,hasPlus(u,'puddle')?3:2)}},
  snipe:{name:'Прицельный плевок',cost:3,target:'enemy',rangeAtk:true,rangeBonus:2,los:true,needStill:true,desc:'Двойной урон и +2 к дальности. Только если ещё не двигался.',run:async(u,t)=>{await shot(u,t);damage(t,u.atk*(hasPlus(u,'snipe')?3:2),{src:u})}},
  peck:{name:'Клюнуть в темя',cost:1,target:'enemy',range:1,desc:'1 урон и спутанность на 2 хода: цель с шансом 33% бьёт сама себя.',run:async(u,t)=>{await lunge(u,t);damage(t,hasPlus(u,'peck')?2:1,{src:u,melee:true});if(alive(t))applyStatus(t,'confused',hasPlus(u,'peck')?3:2)}},
  alarm:{name:'Будильник',cost:2,target:'self',desc:'Союзники в 2 клетках, и он сам, просыпаются: снимает оглушение, спутанность и обездвиживание, даёт +1 запал.',run:async u=>{flt(u,'ДЗЫНЬ','big');alliesOf(u).filter(a=>dist(u,a)<=2).forEach(a=>{a.st.stun=0;a.st.confused=0;a.st.held=0;if(a.mpMax)a.mp=Math.min(a.mpMax,a.mp+(hasPlus(u,'alarm')?2:1));syncUnit(a)});await wait(200)}},
  cheer:{name:'Петушиный бой',cost:3,target:'self',desc:'Все союзники лечат 1 ОЗ, и следующий удар у них на 1 сильнее.',run:async u=>{flt(u,'КО-КО-КО','big');alliesOf(u).forEach(a=>{a.st.rallied=1;heal(a,hasPlus(u,'cheer')?3:1)});await wait(200)}},
  raise:{name:'Поднять павшего',once:true,cost:5,target:'fallen',range:3,desc:'Раз за бой: упавший союзник встаёт с третью ОЗ. Травма остаётся.',run:async(u,t)=>{t.down=false;t.hp=Math.ceil(t.max/(hasPlus(u,'raise')?2:3));flt(t,'встал!','big');logMsg(`${t.name} снова в строю.`);syncUnit(t);await wait(220)}},
  /* Панда */
  bamboo:{name:'Бамбук',asHit:true,cost:1,target:'self',desc:'Вместо удара жуёт: лечит 3 ОЗ, и до её хода каждый удар по ней на 1 слабее.',run:async u=>{heal(u,u.tags.has('glutton')||hasPlus(u,'bamboo')?5:3);u.st.bamboo=1;flt(u,'хрум','info');syncUnit(u);await wait(200)}},
  hug:{name:'Обнимашки',cost:2,target:'enemy',range:1,desc:'Враг рядом 2 хода не может уйти и бьёт только панду.',run:async(u,t)=>{await lunge(u,t);hugOn(u,t)}},
  nap:{name:'Тихий час',asHit:true,cost:2,target:'self',desc:'Вместо удара засыпает: лечит 6 ОЗ, следующий удар по ней не пройдёт, но свой следующий ход она проспит.',run:async u=>{heal(u,hasPlus(u,'nap')?9:6);u.shield=(u.shield||0)+1;u.st.stun=1;flt(u,'хррр','info');syncUnit(u);await wait(200)}},
  flop:{name:'Плюхнуться',cost:2,target:'cell',cellFree:true,range:2,desc:'Прыгает на клетку до 2 и плюхается: враги рядом получают урон и отлетают на клетку.',run:async(u,c)=>{u.x=c.x;u.y=c.y;u.movedTurn=true;syncUnit(u);await wait(200);flt(u,'БУХ','big');DIRS.map(([a,b])=>unitAt(u.x+a,u.y+b)).filter(o=>o&&o.kind!=='mosq'&&enemiesOf(u).includes(o)).forEach(o=>{damage(o,pow(u),{src:u,melee:true});if(alive(o))pushUnit(o,u,hasPlus(u,'flop')?2:1)});if(alive(u))stepHazard(u)}},
  guard:{name:'Все на защиту',cost:2,target:'self',desc:'2 раунда союзники рядом с пандой получают на 1 урона меньше.',run:async u=>{u.st.guard=hasPlus(u,'guard')?3:2;flt(u,'охрана','info');syncUnit(u);await wait(200)}},
  crush:{name:'Придавить',cost:3,target:'enemy',range:1,desc:'Наваливается всем весом: двойной урон, цель не ходит ход. Сама панда стоит до следующего хода.',run:async(u,t)=>{await lunge(u,t);damage(t,pow(u)*(hasPlus(u,'crush')?3:2),{src:u,melee:true});if(alive(t))applyStatus(t,'held',1);u.st.held=1;syncUnit(u)}},
  /* Мартышка */
  banana:{name:'Банан',cost:2,target:'any',range:3,los:true,desc:'Бросок на 3 клетки: союзнику +2 ОЗ, врагу −1 ОЗ.',run:async(u,t)=>{
    if(u.tags.has('grenade')&&chance(.25)){flt(u,'уронила!','big');await wait(200);boomAt(u,u.x,u.y,true);return}
    await shot(u,t,'#f2c230');

    if(u.tags.has('grenade')){boomAt(u,t.x,t.y,false);return}
    damage(t,hasPlus(u,'banana')?2:1,{src:u})}},
  peel:{name:'Кожура',cost:2,target:'cell',cellFree:true,range:3,desc:'Кладёт кожуру на клетку до 3. Кто наступит, проскользнёт на клетку дальше и потеряет остаток хода. Свои тоже.',run:async(u,c)=>{await shot(u,c,'#f2c230');const k=key(c.x,c.y);(B.peels=B.peels||new Set()).add(k);if(hasPlus(u,'peel'))(B.peelPlus=B.peelPlus||new Set()).add(k);const el=tileEl(c.x,c.y);if(el)el.innerHTML=tileInner(k,R.L);flt(c,'кожура','info')}},
  mimic:{name:'Обезьянничать',cost:1,target:'self',desc:'На этот ход получает приём, который союзник применил последним, на 1 запал дешевле.',can:u=>mimicList(u).length>0,run:async u=>{mimicList(u).forEach(id=>{if(!u.abil.some(a=>a.id===id))u.abil.push({id,temp:true,used:false,spent:false})});u.mimicCheap=hasPlus(u,'mimic')?2:1;flt(u,'повторяю','info');await wait(150)}},
  coconut:{name:'Кокос',cost:2,target:'enemy',range:4,los:true,desc:'Бросок на 4 клетки: АТК+1, с шансом 1 к 3 оглушает.',run:async(u,t)=>{await shot(u,t,'#7b5a34');damage(t,u.atk+1,{src:u});if(alive(t)&&chance(hasPlus(u,'coconut')?.5:.33))applyStatus(t,'stun',1)}},
  cheerup:{name:'Подбодрить',sup:true,cost:2,target:'ally',range:3,noSelf:true,desc:'Союзник получает 2 запала, а его следующий удар на 1 сильнее.',run:async(u,t)=>{if(t.mpMax)t.mp=Math.min(t.mpMax,t.mp+(hasPlus(u,'cheerup')?3:2));t.st.rallied=1;flt(t,'давай!','big');syncUnit(t);await wait(150)}},
  vine:{name:'Лиана',sup:true,cost:2,target:'ally',range:4,line:true,los:true,noSelf:true,desc:'Подтягивает союзника к себе по прямой.',run:async(u,t)=>{dragTo(u,t);await wait(200);if(hasPlus(u,'vine'))heal(t,2);if(alive(t))stepHazard(t)}},
  ruckus:{name:'Переполох',cost:3,target:'self',desc:'Враги в 2 клетках спутаны на ход: с шансом 1 к 3 бьют сами себя.',run:async u=>{flt(u,'У-У-А-А','big');await wait(150);enemiesOf(u).filter(o=>o.kind!=='mosq'&&dist(u,o)<=2).forEach(o=>applyStatus(o,'confused',hasPlus(u,'ruckus')?2:1))}},
  /* Новые мутации */
  suck:{name:'Присосаться',cost:1,target:'enemy',range:1,check:(u,t)=>t.kind!=='mosq',desc:'Сосед не может ходить следующий ход.',run:async(u,t)=>{await lunge(u,t);applyStatus(t,'held',1);if(u.tags.has('suckDrain')&&alive(t)){flt(u,'пьёт','info');damage(t,2,{});heal(u,2)}}},
  milk:{name:'Молоко',cost:1,target:'ally',range:1,noSelf:true,desc:'Сосед лечит 3 ОЗ и получает 1 запал. Сам теряет 2 ОЗ, но от этого не упадёт.',run:async(u,t)=>{const big=u.tags.has('milkPlus');heal(t,big?5:3);if(t.mpMax)t.mp=Math.min(t.mpMax,t.mp+1);const n=big?0:Math.min(2,u.hp-1);if(n>0)damage(u,n,{});await wait(200)}},
  sip:{name:'Выпить лужу',cost:1,target:'cell',cellPool:true,range:1,desc:'Лужа рядом исчезает: +3 ОЗ и +3 токсина.',run:async(u,c)=>{const k=key(c.x,c.y);B.pools.delete(k);const el=tileEl(c.x,c.y);if(el)el.innerHTML=tileInner(k,R.L);flt(u,'глык','big');heal(u,3);addTox(u,3);await wait(200)}},
  lionroar:{name:'Рявкнуть',cost:2,target:'self',desc:'Враги в 2 клетках на ход убегают от него. Боссы не боятся.',run:async u=>{flt(u,'РРРАУ','big');await wait(150);enemiesOf(u).filter(o=>dist(u,o)<=(u.tags.has('roar3')?3:2)&&o.kind!=='mosq'&&o.kind!=='egg').forEach(o=>{if(o.boss){flt(o,'не боится','info');return}o.fearOf=u.uid;applyStatus(o,'fear',1)})}},
  gulp:{name:'Проглотить',cost:2,target:'any',range:1,can:u=>!u.gulped,check:(u,t)=>!t.boss&&!t.special&&t.kind!=='barrel'&&t.kind!=='egg'&&!isExtra(t)&&!t.rider&&!t.riding&&(t.side===u.side||realFoes().length>1),desc:'Носит соседа в мешке 2 хода, потом выплёвывает на 2 клетки. Запалом можно выплюнуть раньше, куда захочешь. Босса и последнего врага не берёт.',run:async(u,t)=>{await lunge(u,t);if(t.charge){t.charge=null;clearWarn(t)}t.gone=true;t.swallowed=u.uid;u.gulped=t;u.gulpT=2;u.abil.push({id:'spitout',used:false,spent:false});syncUnit(t);flt(u,'ГЛОТЬ','big');logMsg(`${u.name} проглотил: ${t.name}.`)}},
  spitout:{name:'Выплюнуть',cost:1,target:'cell',cellFree:true,range:2,can:u=>!!u.gulped,desc:'Выплёвывает проглоченного на выбранную клетку в 2 шагах.',run:async(u,c)=>{spitOutAt(u,c);await wait(200)}},

/* ---------- Очередь ходов ---------- */
const GAS_ROUND=9;
function order(){return B.units.filter(u=>alive(u)&&!u.asleep&&u.side!=='obj'&&u.kind!=='husk').sort((a,b)=>b.init-a.init||(a.side==='pet'?-1:1)||a.uid-b.uid)}

  B.units.forEach(u=>{if(u.kind==='husk'&&alive(u)&&u.huskTill<B.round){u.gone=true;syncUnit(u)}});
  /* Заячьи уши: первым в самом начале боя, даже в засаде */

  if(q&&B.round>0){
    B.queue.splice(Math.ceil(B.queue.length/2),0,q);
    if(B.round%2===0&&B.units.filter(u=>u.race==='swarm'&&alive(u)).length<3){if(addFoe('swarm',q))logMsg('Королева выпустила рой.')}

}
function checkEnd(){

  if(!alivePets().some(u=>!isExtra(u))){B.over=true;B.result='lose'}
  else if(B.goalDone){B.over=true;B.result='win'}
  else if(B.map&&B.map.goal&&!realFoes().length){if(!B.goalNag){B.goalNag=true;logMsg('Врагов не осталось. Цель ещё не выполнена: '+B.map.goal)}return false}

    if(aliveMosq().length){if(!B.hunt){B.hunt=true;logMsg('Врагов нет. Лови комара, пока не улетел!')}return false}
    B.over=true;B.result='win';

}
async function runFight(){

    if(!me.queue.length)newRound();

    const u=me.queue.shift();
    if(!alive(u))continue;
    u.acted=me.round;
    me.cur=u;u.skip=false;syncAll();renderQueue();renderPanel();
    if(me.map)await Cam.focus(u);
    await beginTurn(u);

    if(alive(u)&&!u.skip){
      if(u.kind==='egg')eggTurn(u);
      else if(u.st.contused>0&&u.kind!=='mosq')await contusedTurn(u);
      else if(u.st.fear>0&&u.kind!=='mosq')await fearTurn(u);
      else if(u.st.hypno>0&&u.kind!=='mosq')await hypnoTurn(u);
      else if(u.side==='pet'&&(u.kind==='pet'||u.kind==='baby')){
        if(u.pet&&chance(fitChance(u.pet.tox)))await fitTurn(u);

function endTurn(u){

}

/* ---------- Ход игрока ---------- */
function playerTurn(u){

}
function refreshInput(){
  const I=B.input;if(!I)return;
  const u=I.u;I.cells=new Map();I.targets=[];I.nets=[];
  if(I.mode==='attack'){
    if(u.riding){
      /* С шеи можно бесплатно спрыгнуть на соседнюю клетку */
      DIRS.forEach(([a,b])=>{const x=u.x+a,y=u.y+b,k=key(x,y);if(inB(x,y)&&!B.rocks.has(k)&&!unitAt(x,y))I.cells.set(k,{x,y,d:1})});
    }else if(!I.moved)I.cells=reachable(u);
    else if(I.hit&&I.hop){u.hopNow=true;I.cells=reachable(u);u.hopNow=false}
    if(!I.hit&&!u.riding){
      I.nets=catchTargets(u);
      I.targets=enemiesOf(u).filter(t=>canHit(u,u,t)&&!I.nets.includes(t));
      if(u.tags.has('nearestOnly')&&I.targets.length){const m=Math.min(...I.targets.map(t=>dist(u,t)));I.targets=I.targets.filter(t=>dist(u,t)===m)}
      B.units.forEach(b=>{if(b.kind==='barrel'&&alive(b)&&!b.asleep&&canHit(u,u,b))I.targets.push(b)});
    }
  }else I.targets=abilTargets(u,I.mode);
  /* Делать больше нечего: не заставляем нажимать лишний раз */
  if(I.mode==='attack'&&I.moved&&!I.undo&&!I.targets.length&&!I.nets.length&&!I.cells.size&&!u.abil.some(a=>usable(u,a))){endInput();return}
  tutTip();
  renderHL();renderPanel();
}
function endInput(){const I=B.input;if(!I)return;tutAck();B.input=null;B.tip='';B.tipId='';clearHL();renderPanel();I.res()}
async function act(fn,mark){
  const I=B.input;
  tutAck();
  B.busy=true;clearHL();
  await fn();
  if(!B||B.input!==I)return;
  B.busy=false;I.undo=null;
  if(mark==='hit'){I.hit=true;if(I.hits>0){I.hits--;I.hit=false;flt(I.u,'ещё раз','info')}}
  /* Тень: добил ударом, можно снова шагнуть и ударить */
  if(I.u.resetTurn){I.u.resetTurn=false;if(mark==='hit'&&alive(I.u)){I.hit=false;I.moved=false;flt(I.u,'ещё!','big')}}
  if(I.u.side!=='pet'||!alive(I.u)||checkEnd()){endInput();return}

}
async function onCell(x,y){
  if(!B)return;
  const I=B.input;let t=unitAt(x,y);if(t&&t.asleep)t=null;
  if(!I||B.busy){if(t)showInfo(t);return}
  if(Coach.want('b:info')){if(t)showInfo(t);Coach.on('b:info');return}
  if(t&&t.rider&&I.targets.includes(t.rider)&&!I.targets.includes(t))t=t.rider;
  const u=I.u;
  const io=!t&&B.inter&&B.inter.find(o=>o.x===x&&o.y===y);
  if(io&&I.mode==='attack'){
    if(!I.hit&&!u.riding&&dist(u,io)===1&&!io.deco&&interOk(io))return act(()=>useInter(u,io),'hit');
    logMsg(interHint(u,io));return;
  }
  if(I.mode==='attack'){
    if(t&&I.nets.includes(t)){Coach.on('b:catch');return act(()=>catchMosq(u,t),'hit')}
    if(t&&I.targets.includes(t)){G.tut.hit=1;Coach.on('b:hit');return act(()=>attack(u,t),'hit')}
    if(!t&&I.cells.has(key(x,y))){
      const prev={x:u.x,y:u.y},safe=!cellDanger(x,y),off=!!u.riding,hopping=!off&&I.moved;
      tutAck();G.tut.move=1;Coach.on('b:move');
      B.busy=true;clearHL();
      const step=dist(u,{x,y});
      if(off){unride(u);I.moved=true}
      else if(hopping)I.hop=0;
      else if(I.steps>0)I.steps--;
      else I.moved=true;
      u.ran=(u.ran||0)+step;
      leaveSlime(u,u.x,u.y,x,y);
      u.from={x:u.x,y:u.y};u.movedTurn=true;u.x=x;u.y=y;syncUnit(u);
      if(B.map)revealCheck();
      await wait(190);
      stepHazard(u);
      if(!B||B.input!==I)return;
      if(u.slipped){u.slipped=false;B.busy=false;logMsg(`${u.name} поскользнулся на кожуре и потерял остаток хода.`);endInput();return}
      B.busy=false;I.undo=safe&&!off&&!hopping&&I.moved?prev:null;
      if(u.side!=='pet'||!alive(u)||checkEnd()){endInput();return}
      refreshInput();return;
    }
    if(t)showInfo(t);
    return;
  }
  const A=ABIL[I.mode],m=I.mode;
  if(A.target==='cell'){
    if(I.targets.some(c=>c.x===x&&c.y===y)){Coach.on('b:abil');return act(()=>useAbility(u,m,{x,y}))}
  }else if(A.target==='fallen'){
    const f=I.targets.find(o=>o.x===x&&o.y===y);
    if(f){Coach.on('b:abil');return act(()=>useAbility(u,m,f))}
  }else if(t&&I.targets.includes(t)){Coach.on('b:abil');return act(()=>useAbility(u,m,t))}
  I.mode='attack';refreshInput();
  if(t)showInfo(t);
}
function setMode(m){
  const I=B&&B.input;if(!I||B.busy)return;
  if(m==='attack'){I.mode='attack';B.info='';refreshInput();return}
  const a=I.u.abil.find(x=>x.id===m);if(!a||!usable(I.u,a))return;
  if(ABIL[m].target==='self'){act(()=>useAbility(I.u,m,I.u),asHit(I.u,m)?'hit':undefined);return}
  I.mode=I.mode===m?'attack':m;

function undoMove(){const I=B&&B.input;if(!I||B.busy||!I.undo)return;I.u.x=I.undo.x;I.u.y=I.undo.y;I.u.ran=0;I.u.movedTurn=false;I.moved=false;I.undo=null;I.mode='attack';syncUnit(I.u);refreshInput()}
function catchNow(){const I=B&&B.input;if(!I||B.busy||!I.nets.length)return;const m=I.nets[0];act(()=>catchMosq(I.u,m),'hit')}

  if(!alive(u)||B.over)return;

/* ---------- Наезд медоеда ---------- */
function dropNaezd(u){B.units.forEach(x=>{if(x.naezdBy===u.uid){x.naezdBy=0;x.st.naezd=0;syncUnit(x)}});u.naezdT=0}
function setNaezd(u,t){
  dropNaezd(u);
  t.naezdBy=u.uid;t.st.naezd=1;u.naezdT=u.tags.has('grudge')?99:3;syncUnit(t);
}
/* Погибшая цель снимает наезд, у Злопамятного он перескакивает на ближайшего врага */
function naezdFall(u){
  if(u.naezdT)dropNaezd(u);
  if(!u.naezdBy)return;
  const m=B.units.find(x=>x.uid===u.naezdBy);u.naezdBy=0;u.st.naezd=0;
  if(!m)return;
  m.naezdT=0;
  if(!alive(m)||!m.tags.has('grudge'))return;
  const n=enemiesOf(m).filter(o=>o!==u&&sizeable(o)&&!isExtra(o)).sort((a,c)=>dist(a,m)-dist(c,m))[0];
  if(n){setNaezd(m,n);flt(m,'следующий!','big')}
}
/* Кратчайший путь медоеда к клетке рядом с целью: через своих можно, через врагов и камни нельзя */
function chasePath(u,t){
  const fly=u.tags.has('fly'),goal=new Set(DIRS.map(([a,b])=>key(t.x+a,t.y+b))),prev=new Map([[key(u.x,u.y),null]]),q=[[u.x,u.y]];
  let end=null;
  while(q.length&&!end){
    const[x,y]=q.shift();
    for(const[a,b]of DIRS){
      const nx=x+a,ny=y+b,nk=key(nx,ny);
      if(!inB(nx,ny)||prev.has(nk))continue;
      const rock=B.rocks.has(nk);if(rock&&!fly)continue;
      if(B.rooms&&u.side==='pet'){const rm=roomAt(nx,ny);if(rm&&!rm.open)continue}
      const o=unitAt(nx,ny);if(o&&o!==u&&(o.side!==u.side||!sizeable(o)))continue;
      prev.set(nk,key(x,y));
      if(goal.has(nk)&&!o&&!rock){end=nk;break}
      q.push([nx,ny]);
    }
  }
  if(!end)return[];
  const out=[];for(let k=end;k&&k!==key(u.x,u.y);k=prev.get(k)){const[x,y]=k.split(',').map(Number);out.unshift({x,y})}
  return out;
}
/* Цель сходила на n клеток: медоед вслепую идёт столько же, хоть по лужам и газу, а догнав, кусает */
async function chase(t,n){
  if(!B||B.over||!alive(t)||!t.naezdBy||!(n>0))return;
  const u=B.units.find(x=>x.uid===t.naezdBy);
  if(!alive(u)||u.riding||u.gulped||u.st.stun>0||u.st.sleep>0||!enemiesOf(u).includes(t))return;
  if(dist(u,t)>1&&!(u.st.held>0)){
    const path=chasePath(u,t);let steps=Math.min(Math.ceil(n),path.length);
    while(steps>0&&unitAt(path[steps-1].x,path[steps-1].y))steps--;
    if(steps>0)flt(u,'за ним!','info');
    for(let i=0;i<steps;i++){
      const c=path[i];
      if(B.rocks.has(key(c.x,c.y))&&i===steps-1)break;
      u.from={x:u.x,y:u.y};u.x=c.x;u.y=c.y;syncUnit(u);await wait(110);
      const busy=B.units.some(o=>o!==u&&alive(o)&&o.x===u.x&&o.y===u.y&&!o.riding);
      if(!busy)stepHazard(u);
      if(!alive(u)||B.over||u.slipped||u.st.held>0)break;
    }
    u.slipped=false;u.from=null;
  }
  if(!alive(u)||!alive(t)||B.over||dist(u,t)>1)return;
  flt(u,'догнал','big');
  if(hasPlus(u,'naezd'))u.st.rallied=1;
  await attack(u,t);await wait(120);
}

/* ---------- Ход противника ---------- */
function chooseTarget(u){
  if(u.st.dazzle>0){const d=B.units.find(x=>x.uid===u.dazzleBy);if(alive(d)&&d!==u)return d}
  let list=enemiesOf(u).filter(t=>t!==u.rider);
  if(u.kind==='minion')list=list.filter(t=>t.kind!=='mosq');
  if(!list.length)return null;
  const seen=list.filter(t=>!camo(t));if(seen.length)list=seen;
  if(u.st.hug>0){const h=B.units.find(x=>x.uid===u.hugBy);if(h&&alive(h)&&list.includes(h))return h}
  const big=list.find(t=>t.tags.has('bigTaunt'));if(big&&!u.psy&&!u.fit)return big;
  const roar=list.find(t=>t.st.roar>0&&dist(u,t)<=t.st.roar);if(roar)return roar;
  const score=t=>dist(u,t)+(t.tags.has('stench')?3:0)-(t.tags.has('taunt')?4:0)+(t.kind==='mosq'?1.5:0)+Math.random()*.4;
  return list.map(t=>[score(t),t]).sort((a,b)=>a[0]-b[0])[0][1];
}
function aiAbility(u,t){
  for(const a of u.abil){
    if(!usable(u,a))continue;
    const id=a.id,A=ABIL[id];
    if(['rally','pack','cheer','alarm','raise','snatch','milk','gulp','spitout','recolor','bamboo','nap','mimic','peel','cheerup','vine','ruckus','guard','flop','banana','psych','cocoon','smile','hunt'].includes(id))continue;
    if(id==='ink'){if(dist(u,t)<=3&&dist(u,t)>1)return[id,{x:t.x,y:t.y}];continue}
    if(A.target==='cell'||A.target==='fallen')continue;
    if(id==='shove'){if(dist(u,t)===1&&chance(.4))return[id,t];continue}
    if(A.target==='self'){
      if(id==='dontcare'){if(u.st.poison||u.st.bleed||u.st.blind||u.st.held)return[id,u];continue}
      if(id==='hide'||id==='hardhide'?u.hp<u.max*.5:DIRS.some(([x,y])=>{const o=unitAt(u.x+x,u.y+y);return o&&enemiesOf(u).includes(o)}))return[id,u];
      continue;
    }
    if(A.target==='ally'){if(u.hp<u.max*.5)return[id,u];continue}
    if(abilTargets(u,id).includes(t))return[id,t];
  }
  return null;
}
const danger=(u,c)=>{
  const k=key(c.x,c.y);let v=0;
  if(B.fx[k]&&B.fx[k].type==='gas'&&!u.tags.has('poisonImmune'))v+=2;

function lineClear(a,t){

/* Брынза: враг рядом грызёт сыр вместо удара */
function nearCheese(u){

async function aiTurn(u){

    const c=[...reachable(u).values()].filter(p=>!danger(u,p)).sort((a,b)=>dist(a,ch)-dist(b,ch))[0];
    if(c&&dist(c,ch)<ch.d){u.x=c.x;u.y=c.y;u.movedTurn=true;syncUnit(u);await wait(200);stepHazard(u);await chase(u,c.d)}

    flt(u,'грызёт сыр','big');
    if(--ch.f.left<=0){delete B.fx[ch.k];renderFx()}

    return;
  }

  const pm=pathMap(u,t),pd=c=>{const v=pm.get(key(c.x,c.y));return v===undefined?99:v};
  const near=()=>cells.sort((a,b)=>pd(a)+pen(a)-pd(b)-pen(b)||a.d-b.d)[0];
  let dest=null;
  if(ai==='kite'){
    const pool=cells.filter(c=>dist(c,t)>=2&&dist(c,t)<=3&&los(c,t));
    dest=pool.length?pool.sort((a,b)=>pen(a)-pen(b)||dist(b,t)-dist(a,t)||a.d-b.d)[0]:near();
  }else{
    const can=cells.filter(c=>canHit(u,c,t));
    if(can.length)dest=can.sort((a,b)=>pen(a)-pen(b)||(u.range>1?dist(b,t)-dist(a,t):0)||a.d-b.d)[0];
    else if(ai==='charge'){const lined=cells.filter(c=>dist(c,t)>=2&&dist(c,t)<=6&&lineClear(c,t)).sort((a,b)=>pen(a)-pen(b)||a.d-b.d);dest=lined[0]||near()}
    else dest=near();

  if(u.slipped){u.slipped=false;return}
  if(!alive(t))return;
  if(ai==='charge'&&dist(u,t)>=2&&dist(u,t)<=6&&lineClear(u,t)){telegraph(u,t);await wait(320);return}
  const ab=aiAbility(u,t);
  if(ab){await useAbility(u,ab[0],ab[1]);await wait(120)}

    await attack(u,t);await wait(120);

      const away=[...reachable(u).values()].filter(c=>c.d<=3&&!danger(u,c)).sort((a,b)=>dist(b,t)-dist(a,t))[0];
      if(away){u.x=away.x;u.y=away.y;syncUnit(u);await wait(200);await chase(u,away.d)}
    }
  }
}

/* ---------- Опыт и уровни ---------- */
function grantXP(me,gain){
  const ups=[];
  me.units.filter(u=>u.side==='pet'&&u.pet&&R.pets.includes(u.pet.id)).forEach(u=>{
    ups.push(...petXP(u.pet,u.down?Math.ceil(gain/2):gain));
  });
  save();
  return ups;
}
function levelOptions(p,l,legend){
  const opts=[];
  if(!legend)((LEARN[p.race]||{})[l]||[]).filter(id=>!p.learned.includes(id)).forEach(id=>opts.push('a:'+id));
  const abil=petStats(p).abil;
  if(!opts.length&&(l>=7||legend)){const up=abil.filter(id=>PLUS[id]&&!p.plus.includes(id));if(up.length)opts.push('u:'+pick(up))}
  const hab=abil.filter(id=>ABIL[id].cost>=2&&!p.cheap.includes(id));
  if(opts.length<2&&l%2&&hab.length)opts.push('c:'+pick(hab));
  const ok=k=>{const P=PERKS[k];return(!P.when||P.when(p))&&!(P.tags&&P.tags.every(t=>p.ptags.includes(t)))};
  const pool=Object.keys(PERKS).filter(ok),taken=new Set();
  if(pool.includes('cure')&&opts.length<3){opts.push('p:cure');taken.add('cure')}
  const odds=perkOdds(l,legend);
  let guard=0;
  while(opts.length<3&&guard++<60){
    const r=Math.random(),want=r<odds[2]?3:r<odds[2]+odds[1]?2:1;
    const list=pool.filter(k=>PERKS[k].t===want&&!taken.has(k));
    if(!list.length)continue;
    const k=pick(list);taken.add(k);opts.push('p:'+k);
  }
  return opts;
}
function optionCard(o){
  const[t,id]=o.split(':');
  if(t==='a')return `<button class="perk t2" data-res="${o}"><em>Новый приём · запал ${ABIL[id].cost}</em><b>${ABIL[id].name}</b><span>${ABIL[id].desc}</span></button>`;
  if(t==='u')return `<button class="perk t2" data-res="${o}"><em>Усиление приёма</em><b>${ABIL[id].name}+</b><span>${PLUS[id]}</span></button>`;
  if(t==='c')return `<button class="perk" data-res="${o}"><em>Привычка</em><b>${ABIL[id].name}</b><span>Стоит на 1 запал дешевле.</span></button>`;
  const P=PERKS[id];
  return `<button class="perk t${P.t}" data-res="${o}"><em>${RARITY[P.t].name}</em><b>${P.name}</b><span>${P.text}</span></button>`;
}
function applyOption(p,o){
  const[t,id]=o.split(':');
  if(t==='a')p.learned.push(id);
  else if(t==='c')p.cheap.push(id);
  else if(t==='u')p.plus.push(id);
  else{const P=PERKS[id];if(P.s)for(const k in P.s)p.boost[k]=(p.boost[k]||0)+P.s[k];if(P.tags)p.ptags.push(...P.tags);if(P.run)P.run(p)}
}

async function levelUpScreen(p,l,legend){
  if(!legend&&l>=5&&!p.spec)await chooseSpec(p);
  const g=legend?{}:growAt(p.race,l),cap=mutCap(l),more=!legend&&cap>mutCap(l-1);

/* ---------- После боя ---------- */
async function finishFight(res){
  const me=B;clearHL();
  B.units.forEach(u=>{if(u.swallowed&&u.side==='pet'){u.gone=false;u.swallowed=0}});
  B.units.filter(u=>u.side==='pet'&&u.pet).forEach(u=>{R.hp[u.pet.id]=u.down?Math.ceil(u.max*.25):Math.max(1,u.hp)});
  const camels=[];
  if(res==='win'){
    const lvl=R.lvl,n=R.fight,fast=B.round<=4,food=4+2*lvl+3*n+rnd(3)+(fast?3:0);
    R.loot.food+=R.pets.some(id=>{const p=getPet(id);return p&&p.spec==='thief'})?Math.round(food*1.3):food;
    showBanner(fast?'Быстрая победа':'Бой выигран');
    await wait(850);
    if(B!==me)return;
    const ups=grantXP(me,R.tutor?xpNeed(1):15+5*lvl+(fast?5:0));
    R.fight++;
    R.pets.forEach(id=>{const p=getPet(id);if(p&&petStats(p).tags.has('hump')){const m=petStats(p).hp;R.hp[id]=Math.min(m,(R.hp[id]||m)+(petStats(p).tags.has('bigHump')?6:3));camels.push(p.name)}});
    R.pets.forEach(id=>{const p=getPet(id);if(p&&petStats(p).tags.has('hump4')){const m=petStats(p).hp;R.hp[id]=Math.min(m,(R.hp[id]||m)+4);if(!camels.includes(p.name))camels.push(p.name)}});
    R.pets.forEach(id=>{const p=getPet(id);if(p&&petStats(p).tags.has('grazer')){const m=petStats(p).hp;R.hp[id]=Math.min(m,(R.hp[id]||m)+3);if(!camels.includes(p.name))camels.push(p.name)}});
    if(R.pets.some(id=>{const p=getPet(id);return p&&petStats(p).tags.has('honey')}))R.pets.forEach(id=>{const p=getPet(id);if(p){const m=petStats(p).hp;R.hp[id]=Math.min(m,(R.hp[id]||m)+3);if(!camels.includes(p.name))camels.push(p.name)}});
    for(const{p,l,legend}of ups)await levelUpScreen(p,l,legend);
    if(R.fight>=R.L.fights.length)return finishRaid('done');
    if(R.evDue[R.fight]){R.evDue[R.fight]=false;await runEvent()}
    if(!R.pets.length)return finishRaid('left');
    renderInter(camels,fast);
    return;
  }
  if(res==='lose'){showBanner('Разгром');await wait(1000);return finishRaid('wipe')}
  return finishRaid('flee');
}

function roomAt(x,y){return B&&B.rooms?B.rooms.find(r=>x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1):null}
function buildMapFight(L){
  const M=MAPS[L.map],rows=M.rows;
  H=rows.length;W=rows[0].length;
  const walls=new Set(),rocks=new Set(),props=new Set();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!MapArt.isFloor(MapArt.cellOf(M,x,y)))walls.add(key(x,y));
  (M.props||[]).forEach(p=>{for(let i=0;i<(p.w||1);i++){const k=key(p.x+i,p.y);rocks.add(k);props.add(k)}});
  const inter=(M.inter||[]).map(o=>({...o,open:false,on:false,powered:o.need?true:undefined}));
  inter.forEach(o=>{if(!walls.has(key(o.x,o.y))){rocks.add(key(o.x,o.y));props.add(key(o.x,o.y))}});
  return{M,walls,rocks,props,pools:new Set(M.pools||[]),inter,rooms:(M.rooms||[]).map(r=>({...r,open:false}))};
}

function mapMosqCell(){

const Cam=(()=>{

  const cell=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'))||56;

  function fitScale(){const v=vp();if(!v)return 1;const z=size();return Math.min(v.clientWidth/z.w,v.clientHeight/z.h,1)}

    const v=vp();if(!v)return;const z=size(),w=z.w*st.s,h=z.h*st.s,vw=v.clientWidth,vh=v.clientHeight,pad=24;
    st.x=w<=vw?(vw-w)/2:clamp(st.x,vw-w-pad,pad);
    st.y=h<=vh?(vh-h)/2:clamp(st.y,vh-h-pad,pad);
  }
  function apply(){
    const c=cam();if(!c)return;clampXY();
    c.style.transform=`translate(${st.x.toFixed(1)}px,${st.y.toFixed(1)}px) scale(${st.s.toFixed(4)})`;
    const b=$('#camFit');if(b)b.textContent=st.s<=fitScale()+.01?'Ближе':'Всё поле';
    arrows();
  }
  /* Наезд камеры. Бой ждёт его конца, поэтому любой обрыв (палец, новый наезд, спящая вкладка) обязан отпустить ожидание */
  let done=null;
  function stopAnim(){cancelAnimationFrame(st.anim);if(done){const d=done;done=null;d()}}
  function animTo(x,y,s,ms=280){
    stopAnim();

    if(!SPEED||reduce||ms<=0){st.x=x;st.y=y;st.s=s;apply();return Promise.resolve()}
    const x0=st.x,y0=st.y,s0=st.s,t0=performance.now(),dur=ms*Math.min(1,SPEED);
    return new Promise(res=>{
      done=res;
      const fin=()=>{if(done!==res)return;done=null;cancelAnimationFrame(st.anim);st.x=x;st.y=y;st.s=s;apply();res()};
      const f=t=>{if(done!==res)return;const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);st.x=x0+(x-x0)*e;st.y=y0+(y-y0)*e;st.s=s0+(s-s0)*e;apply();if(k<1)st.anim=requestAnimationFrame(f);else fin()};
      st.anim=requestAnimationFrame(f);

  }

  if(!pool.length)return null;

  const seen=G.evSeen||{},now=G.evN||0,wt=e=>(e.w||1)*(seen[e.id]?Math.min(1,(now-seen[e.id])/6+.1):2);
